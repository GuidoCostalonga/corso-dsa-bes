<title>Corso Tutor DSA e BES</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b2430; --muted:#5b6878;

  --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#141a21; --panel:#1c242e; --ink:#e8edf3; --muted:#a3b1c2;
  --line:#2c3946; --accent:#5fb3cf; --accent-soft:#1f303a;
  --ok:#7fd0a9; --ok-soft:#1d2f28; --warn:#e0a367; --warn-soft:#33271b;

}
html[data-dys="on"]{
  --font:"OpenDyslexic","Comic Sans MS",Verdana,Tahoma,sans-serif;
  --ls:0.05em; --ws:0.18em; --lh:1.95;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws)}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit;cursor:pointer}

/* ---------- layout ---------- */
#top{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.8rem;padding:.6rem 1rem;flex-wrap:wrap}
#top h1{font-size:1.02rem;margin:0;font-weight:700;letter-spacing:0}
#top .sub{color:var(--muted);font-size:.8rem}
.spacer{flex:1}
.tbtn{background:transparent;border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:.35rem .6rem;font-size:.82rem}
.tbtn:hover{background:var(--accent-soft);border-color:var(--accent)}
a.tbtn{text-decoration:none;display:inline-flex;align-items:center;line-height:1.4;font-size:1rem}
.tbtn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

#bar{height:5px;background:var(--line)}
#bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s}

#wrap{display:grid;grid-template-columns:288px 1fr;gap:0;align-items:start}
#side{position:sticky;top:56px;max-height:calc(100vh - 56px);overflow:auto;
  background:var(--panel);border-right:1px solid var(--line);padding:1rem .8rem 3rem}
#main{padding:1.6rem clamp(1rem,4vw,3rem) 5rem;max-width:940px}

#search{width:100%;padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);margin-bottom:.8rem;font-family:inherit}
.navgroup{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  margin:1rem .4rem .35rem}
.navitem{display:flex;gap:.5rem;align-items:flex-start;width:100%;text-align:left;
  background:transparent;border:0;border-radius:8px;padding:.45rem .5rem;color:var(--ink);
  font-size:.88rem;line-height:1.35}
.navitem:hover{background:var(--accent-soft)}
.navitem.active{background:var(--accent);color:#fff}
.navitem .num{opacity:.6;font-variant-numeric:tabular-nums;min-width:1.6em}
.navitem .tick{margin-left:auto;color:var(--ok);font-weight:700}
.navitem.active .tick{color:#fff}

.meta{color:var(--muted);font-size:.82rem;margin-bottom:1.4rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:1.1rem 1.2rem;margin:1rem 0}
h3{font-size:1.12rem;margin:1.8rem 0 .5rem;border-left:4px solid var(--accent);padding-left:.6rem}
h4{font-size:.98rem;margin:1.1rem 0 .35rem;color:var(--accent)}
p{margin:.6rem 0}
ul,ol{margin:.5rem 0 .9rem;padding-left:1.3rem}
li{margin:.28rem 0}
.lead{font-size:1.05rem;color:var(--muted)}
.box{border-left:4px solid var(--accent);background:var(--accent-soft);

table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.9rem;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:.5rem .6rem;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:.9rem}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;

mark{background:#ffe9a8;color:#1b2430;padding:0 .15em}
html[data-theme="dark"] mark{background:#6b5a1f;color:#fff}
.small{font-size:.84rem;color:var(--muted)}
blockquote{margin:1rem 0;padding:.6rem 1rem;border-left:3px solid var(--muted);

/* ---------- quiz ---------- */
.quiz{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem;margin:1.4rem 0}
.q{border-top:1px solid var(--line);padding:.9rem 0}
.q:first-of-type{border-top:0}
.q .qt{font-weight:600;margin-bottom:.45rem}
.opt{display:flex;gap:.55rem;align-items:flex-start;padding:.34rem .5rem;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--accent-soft)}
.opt input{margin-top:.35rem;flex:none}
.q.good .qt::after{content:" ✔";color:var(--ok)}
.q.bad .qt::after{content:" ✘";color:var(--err)}
.why{margin-top:.5rem;font-size:.86rem;padding:.5rem .7rem;border-radius:8px;
  background:var(--ok-soft);border-left:3px solid var(--ok)}

.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:.55rem 1.1rem;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.score{font-weight:700;margin-top:.9rem}

/* ---------- tools ---------- */
label.f{display:block;font-size:.82rem;color:var(--muted);margin:.7rem 0 .2rem;font-weight:600}
input.f,textarea.f,select.f{width:100%;padding:.5rem .6rem;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:.92rem}
textarea.f{min-height:70px;resize:vertical}
.chk{display:flex;gap:.5rem;align-items:flex-start;padding:.3rem .4rem;border-radius:6px}

.footnav{display:flex;gap:.7rem;margin-top:2.5rem;padding-top:1.2rem;border-top:1px solid var(--line);flex-wrap:wrap}

#ruler{position:fixed;left:0;right:0;height:2.2em;background:rgba(255,220,110,.28);

@media(max-width:860px){

  #wrap{display:block}#main{padding:0;max-width:none}

id:"intro", parte:"Fondamenti", titolo:"Orientarsi: DSA, BES e la cornice normativa", durata:"25 min",
html:`
<p class="lead">Prima di qualunque strategia didattica serve un vocabolario preciso. "DSA" e "BES" non sono sinonimi, "individualizzato" e "personalizzato" nemmeno, e la differenza fra dispensa ed esonero produce conseguenze molto concrete in sede d'esame.</p>

<h3>1. Che cosa sono i DSA</h3>
<p>I Disturbi Specifici dell'Apprendimento interessano alcune specifiche abilità scolastiche <b>in un contesto di funzionamento intellettivo adeguato all'età anagrafica</b>. Sono coinvolte l'abilità di lettura, di scrittura e di calcolo; a seconda dell'abilità interessata il disturbo prende nome di <b>dislessia</b> (lettura), <b>disgrafia</b> e <b>disortografia</b> (scrittura), <b>discalculia</b> (calcolo).</p>
<div class="box key"><b class="tag">Il punto che cambia tutto</b>
I DSA sono di <b>origine neurobiologica</b>, hanno <b>matrice evolutiva</b> e si mostrano come un'atipia dello sviluppo, <b>modificabile attraverso interventi mirati</b>. Posto nelle condizioni di attenuare o compensare il disturbo, lo studente può raggiungere gli obiettivi di apprendimento previsti. Gli alunni con DSA sviluppano inoltre stili di apprendimento specifici, costruiti proprio per compensare la difficoltà.</div>

<h4>Il criterio della persistenza (DSM-5)</h4>
<ul>
<li><b>A</b> — difficoltà nell'apprendimento e nell'uso di abilità scolastiche, con sintomi persistenti per <b>almeno 6 mesi</b>, nonostante interventi mirati su tali difficoltà.</li>
<li><b>B</b> — abilità scolastiche molto al di sotto delle aspettative per l'età cronologica, con interferenza significativa sul rendimento.</li>
<li><b>C</b> — le difficoltà iniziano negli anni scolastici; a volte si manifestano solo quando le prestazioni richieste diventano più complesse.</li>
<li><b>D</b> — non sono meglio spiegate da disabilità intellettive, deficit visivi o uditivi, disturbi mentali o neurologici, avversità psicosociali, mancata conoscenza dell'italiano o istruzione inadeguata.</li>
</ul>
<p class="small">La persistenza va intesa come progresso ristretto per almeno sei mesi <i>nonostante</i> aiuti extra a casa e a scuola. Se la difficoltà si risolve con un cambio di metodo, non era un disturbo.</p>

<h3>2. Che cosa sono i BES</h3>
<p>Il Bisogno Educativo Speciale è <b>qualsiasi difficoltà evolutiva di funzionamento in ambito educativo e/o di apprendimento</b>, permanente o transitoria. È un contenitore molto più ampio dei DSA: disabilità fisica, psichica o sensoriale; disturbi evolutivi specifici; svantaggio ambientale, culturale, linguistico, socio-economico.</p>
<table>
<tr><th>Fascia</th><th>Chi</th><th>Riferimento</th><th>Documento</th></tr>
<tr><td>1ª</td><td>Alunni con disabilità certificata</td><td>L. 104/1992</td><td><b>PEI</b></td></tr>
<tr><td>2ª</td><td>Disturbi evolutivi specifici: DSA, ADHD, deficit del linguaggio, DOP, funzionamento cognitivo limite</td><td>L. 170/2010, D.M. 27/12/2012</td><td><b>PDP</b></td></tr>
<tr><td>3ª</td><td>Svantaggio socio-economico, linguistico, culturale; alunni stranieri</td><td>D.M. 27/12/2012, C.M. 8/2013</td><td><b>PDP</b></td></tr>
</table>
<p class="small">Storicamente il termine nasce nel Regno Unito con il <i>Warnock Report</i> (1978); viene ripreso dalla Dichiarazione di Salamanca UNESCO (1994) e allargato dall'ISCED UNESCO (1997) a svantaggi fisici, comportamentali, intellettivi, sociali, economici e linguistici. In Italia l'ufficializzazione ministeriale arriva con la <b>Direttiva del 27 dicembre 2012</b>.</p>

<h3>3. Individualizzato non significa personalizzato</h3>
<div class="grid2">
<div class="card"><h4>Didattica individualizzata</h4>
<p>Pone <b>obiettivi comuni</b> a tutto il gruppo classe, ma adatta le metodologie alle caratteristiche individuali. Sono le attività di recupero e potenziamento che l'alunno svolge per acquisire determinate abilità o competenze, incluse le strategie compensative e il metodo di studio.</p></div>
<div class="card"><h4>Didattica personalizzata</h4>
<p>Può porsi <b>obiettivi diversi</b> per ciascun discente: calibra offerta didattica e modalità relazionali sull'unicità della persona, per far crescere i punti di forza, le preferenze e il talento. Usa mediatori didattici, attenzione agli stili di apprendimento, calibrazione sui livelli raggiunti.</p></div>
</div>
<div class="box"><b class="tag">Nota</b>La Legge 170/2010 insiste più volte su didattica individualizzata e personalizzata: la centralità è nelle <b>metodologie didattiche</b>, non solo negli strumenti compensativi e nelle misure dispensative.</div>

<h3>4. La Legge 170/2010 in otto finalità</h3>
<p>L'articolo 2 della legge indica le finalità che la scuola persegue per le persone con DSA:</p>
<ol>
<li>garantire il diritto all'istruzione;</li>
<li>favorire il successo scolastico, anche con misure didattiche di supporto;</li>
<li><b>ridurre i disagi relazionali ed emozionali</b>;</li>
<li>adottare forme di verifica e valutazione adeguate;</li>
<li>preparare gli insegnanti e sensibilizzare i genitori;</li>
<li>favorire la diagnosi precoce e i percorsi didattici riabilitativi;</li>
<li>incrementare comunicazione e collaborazione fra famiglia, scuola e servizi sanitari;</li>
<li>assicurare eguali opportunità di sviluppo in ambito sociale e professionale.</li>
</ol>
<p>L'art. 1 precisa che i DSA «si manifestano in presenza di capacità cognitive adeguate, in assenza di patologie neurologiche e di deficit sensoriali». Tradotto: <b>alunni con intelligenza uguale o superiore alla norma che utilizzano un diverso modo di apprendere</b>.</p>

<h3>5. Lingue straniere: dispensa ed esonero non sono la stessa cosa</h3>
<table>
<tr><th></th><th>Dispensa</th><th>Esonero</th></tr>
<tr><td>Che cosa tocca</td><td>solo le <b>prestazioni scritte</b></td><td>l'<b>insegnamento della lingua nel suo complesso</b></td></tr>
<tr><td>Condizioni</td><td>certificazione che attesti la gravità e chieda esplicitamente la dispensa; richiesta della famiglia; approvazione del consiglio di classe</td><td>particolare gravità anche in comorbilità, richiesta della famiglia, approvazione del consiglio di classe</td></tr>
<tr><td>In corso d'anno</td><td>valutazione con sole prove orali</td><td>percorso didattico differenziato</td></tr>
<tr><td>All'esame di Stato</td><td>prova orale sostitutiva dello scritto; <b>titolo valido</b> per l'iscrizione all'università</td><td>prove differenziate di valore equivalente ai fini del superamento dell'esame</td></tr>
</table>
<p class="small">Riferimenti: D.M. 5669/2011 art. 6 commi 4 e 6; Linee guida §4.4; D.Lgs. 62/2017 art. 11 c. 13.</p>

<h3>6. La mappa normativa essenziale</h3>
<table>
<tr><th>Norma</th><th>Che cosa introduce</th></tr>
<tr><td>L. 104/1992</td><td>Assistenza, integrazione sociale e diritti delle persone con disabilità. Base del PEI.</td></tr>
<tr><td>DPR 275/1999 art. 4</td><td>Autonomia didattica: la scuola regola i tempi dell'insegnamento sui ritmi di apprendimento degli alunni.</td></tr>
<tr><td>DPR 122/2009 art. 10</td><td>La valutazione e la verifica degli alunni con DSA, anche agli esami di ciclo, devono tenere conto delle situazioni soggettive; nel diploma non si fa menzione delle modalità.</td></tr>
<tr><td><b>L. 170/2010</b></td><td>Riconosce dislessia, disgrafia, disortografia, discalculia; diritto a strumenti compensativi e misure dispensative.</td></tr>
<tr><td>D.M. 5669 del 12/7/2011 + Linee guida</td><td>Disposizioni attuative; definisce PDP, strumenti, misure, forme di verifica e valutazione.</td></tr>
<tr><td>Accordo Stato-Regioni 25/7/2012</td><td>Indicazioni per la diagnosi e la certificazione dei DSA.</td></tr>
<tr><td>Direttiva 27/12/2012 + C.M. 8/2013</td><td>Ufficializzano i BES e l'organizzazione territoriale per l'inclusione (CTS).</td></tr>
<tr><td>D.Lgs. 66/2017 e 96/2019</td><td>Inclusione scolastica; Profilo di funzionamento su base ICF-CY redatto dall'UVM.</td></tr>
<tr><td>D.Lgs. 62/2017 artt. 11 e 20</td><td>Valutazione ed esami: coerenza con il PDP, tempi più lunghi, strumenti già usati in corso d'anno.</td></tr>
<tr><td>L. 134/2015</td><td>Disposizioni per persone con disturbi dello spettro autistico.</td></tr>
<tr><td>Decreto Disabilità (in vigore dal 30/6/2024)</td><td>Riscrive i criteri della L. 104, introduce valutazione multidimensionale e <b>Progetto di vita</b>, accertamento unico INPS.</td></tr>
</table>

<div class="box norm"><b class="tag">Decreto Disabilità: le due novità da ricordare</b>
<b>Nuova definizione</b> — non più «minorazione fisica, psichica o sensoriale, stabilizzata o progressiva», ma «compromissioni fisiche, mentali, intellettive o sensoriali che, <b>in interazione con barriere di diversa natura</b>, possono ostacolare la piena ed effettiva partecipazione nei diversi contesti di vita». È il passaggio dal modello medico al modello bio-psico-sociale dell'ICF.<br><br>
<b>Accomodamento ragionevole</b> — dalla Convenzione ONU (ratificata con L. 18/2009): «le modifiche e gli adattamenti necessari ed appropriati che non impongano un onere sproporzionato o eccessivo». Se la barriera non viene rimossa quando lo si potrebbe, questo <b>è</b> discriminazione fondata sulla disabilità.</div>
`,

id:"quattro", parte:"Fondamenti", titolo:"I quattro disturbi e la questione dell'automatismo", durata:"25 min",
html:`
<p class="lead">Le definizioni cliniche servono a poco se non si capisce il meccanismo comune: nei DSA <b>non si forma l'automatismo</b>. Da questa singola idea discendono quasi tutte le scelte didattiche del corso.</p>

<h3>1. Dislessia</h3>
<p>Si manifesta con <b>minore correttezza e rapidità della lettura a voce alta</b> rispetto a quanto atteso per età anagrafica, classe frequentata e istruzione ricevuta. Risultano più o meno deficitarie, a seconda del profilo e dell'età, la lettura di lettere, di parole, di non-parole e di brani.</p>
<p>Interessa il 3–5% della popolazione scolastica. Sul piano neuroscientifico si osservano alterazioni nelle aree temporo-parietali e occipito-temporali dell'emisfero sinistro e una diversa connettività cerebrale, con elaborazione fonologica più lenta; è documentata una componente ereditaria (geni DYX1C1, DCDC2, KIAA0319).</p>
<div class="box"><b class="tag">Attenzione</b>L'aspetto evolutivo può far somigliare la dislessia a un semplice rallentamento del normale sviluppo. Proprio per questo l'osservazione dei <b>segnali anticipatori</b> fin dalla scuola dell'infanzia è decisiva.</div>

<h3>2. Disgrafia</h3>
<p>Riguarda il <b>controllo degli aspetti grafici e formali</b> della scrittura manuale ed è collegata al momento motorio-esecutivo della prestazione: la grafia risulta poco leggibile, irregolare, faticosa, non adeguata all'età. Non riguarda le regole ortografiche né la lettura, e può coesistere con difficoltà visuo-percettive o di coordinazione motoria fine.</p>

<h3>3. Disortografia</h3>
<p>Riguarda l'utilizzo del <b>codice linguistico</b> in fase di scrittura. È un disordine di codifica del testo scritto, riconducibile a un deficit delle componenti centrali del processo di scrittura, responsabili della transcodifica del linguaggio orale in linguaggio scritto. Produce minore correttezza del testo: errori fonologici, non fonologici, di punteggiatura e grammatica, difficoltà di organizzazione del testo.</p>

<h3>4. Discalculia</h3>
<p>Riguarda l'abilità di calcolo su due piani distinti:</p>
<ul>
<li><b>Cognizione numerica basale</b> — subitizing (riconoscimento immediato di piccole quantità), meccanismi di quantificazione, seriazione, comparazione, composizione e scomposizione di quantità, calcolo a mente.</li>
<li><b>Procedure esecutive</b> — lettura e scrittura dei numeri, incolonnamento, recupero dei fatti numerici, algoritmi del calcolo scritto.</li>
</ul>

<h3>5. Comorbilità: il totale è maggiore della somma</h3>
<p>I disturbi possono coesistere nella stessa persona. La comorbilità può riguardare più DSA fra loro, oppure DSA e altri disturbi del neurosviluppo (linguaggio, coordinazione motoria, attenzione), oppure DSA e disturbi emotivi e del comportamento.</p>
<div class="box alert"><b class="tag">Da ricordare</b>Nel caso di comorbilità <b>il disturbo risultante è superiore alla somma delle singole difficoltà</b>, perché ciascun disturbo influenza negativamente lo sviluppo delle abilità complessive. Una diagnosi con quattro voci non richiede quattro interventi affiancati, ma un intervento ripensato.</div>
<p>Numerosi studi mostrano inoltre che una <b>mancata</b> diagnosi si porta dietro comorbilità psicopatologiche: disturbi specifici del linguaggio, ADHD, disturbo oppositivo provocatorio, disturbi d'ansia, disturbi dell'umore.</p>

<h3>6. Il nodo dell'automatismo</h3>
<p>Diversamente dal parlare e dal camminare, che emergono con la maturazione cerebrale, le abilità scolastiche <b>devono essere insegnate e apprese in modo esplicito</b>. Il DSA altera questo pattern di apprendimento.</p>
<p>L'automatismo è ciò che accade a chi guida un'automobile: appresa la guida, i pedali non richiedono più attenzione cosciente, tanto che si può conversare o ascoltare musica. Quando la strada si stringe o il traffico si intensifica, il pilota automatico lascia il posto a quello manuale.</p>
<h4>Tre proprietà dell'automatismo</h4>
<ol>
<li>si svolge senza attenzione agli aspetti strumentali, se non un'attenzione minima di base;</li>
<li>lascia lo spazio mentale <b>praticamente totale</b> per gli scopi produttivi dell'attività;</li>
<li>richiede al cervello pochissima energia.</li>
</ol>
<h4>E quando l'automatismo non si forma</h4>
<ol>
<li>l'attenzione deve rimanere <b>focale</b>, cioè ad alta intensità, per tutta la durata del compito;</li>
<li>lo spazio mentale è limitato perché quasi tutto occupato dall'impegno strumentale;</li>
<li>l'impegno energetico è notevole e <b>si esaurisce molto più rapidamente</b>: subentra una forte stanchezza.</li>
</ol>
<div class="box key"><b class="tag">Conseguenza operativa</b>La persona con DSA deve svolgere lettura, scrittura o calcolo con un alto livello di autoconsapevolezza e autocontrollo, <b>come se fosse sempre un principiante</b>. Le operazioni possono diventare familiari e più rapide, ma non diventeranno automatiche. Per questo gli esercizi ripetitivi in sé non risolvono, mentre gli strumenti compensativi liberano spazio mentale per il compito cognitivo vero.</div>
<p>Lo stesso vale, per analogia, in altri quadri: nell'ADHD il mantenimento dell'attenzione di base richiede uno sforzo intenzionale invece di essere automatico; e chi non raggiunge la discriminazione automatica di destra e sinistra deve concentrarsi ogni volta per operarla correttamente.</p>

<div class="box"><b class="tag">Il paragone da usare con le famiglie</b>«I bambini con discalculia non si curano: si insegna loro come compensare, esattamente come un bambino miope utilizza gli occhiali da vista.» Nessuno chiede al miope di sforzarsi di vedere meglio.</div>

id:"osservazione", parte:"Fondamenti", titolo:"Osservare in classe e riconoscere per tempo", durata:"20 min",
html:`
<p class="lead">Per individuare un potenziale DSA non servono necessariamente strumenti specialistici: in prima battuta basta osservare le prestazioni nei tre ambiti coinvolti. Serve però sapere <b>cosa</b> guardare e <b>quando</b> preoccuparsi.</p>

<h3>1. Il dato che ridimensiona gli allarmi</h3>
<div class="box key"><b class="tag">Percentuali</b>Circa il <b>20%</b> degli alunni, soprattutto nel primo biennio della primaria, manifesta difficoltà nelle abilità di base coinvolte dai DSA. Di questo 20%, però, <b>solo il 3–4% presenterà un DSA</b>. Una prestazione atipica solo in alcuni casi implica un disturbo.</div>
<p>Dato nazionale di riferimento (a.s. 2016/17): 253.840 studenti con DSA, pari al 3,6% della popolazione scolastica; 254.366 studenti con disabilità, pari al 2,9%.</p>

<h3>2. Segnali osservabili</h3>
<h4>Lettura</h4>
<ul>
<li>permanere di una <b>lettura sillabica ben oltre la metà della prima primaria</b>;</li>
<li>tendenza a leggere la stessa parola in modi diversi nel medesimo brano;</li>
<li>perdere frequentemente il segno o la riga.</li>
</ul>
<h4>Scrittura</h4>
<ul>
<li>errori ricorrenti che possono apparire comuni in una fase di apprendimento precedente ma che <b>si presentano a lungo e non occasionalmente</b>;</li>
<li>nei ragazzi più grandi, estrema difficoltà a controllare le regole ortografiche o la punteggiatura.</li>
</ul>
<h4>Gesto grafico (indicatori di disgrafia)</h4>
<ul>
<li>eccessiva pressione della penna sul foglio, con segni profondi o fogli incisi;</li>
<li>andamento irregolare rispetto al rigo: parole che salgono o scendono, righe ondulate;</li>
<li>difficoltà a mantenere una direzione costante del tratto nelle righe lunghe;</li>
<li>scrittura molto lenta e interrotta da pause, oppure troppo rapida e poco controllata;</li>
<li>distanza variabile fra parole e fra lettere della stessa parola;</li>
<li><b>variabilità dei grafemi</b>: lettere molto diverse fra loro per dimensione, forma e inclinazione.</li>
</ul>
<h4>Comportamento</h4>
<ul>
<li>stanchezza precoce nei compiti scritti, mano dolorante, richieste frequenti di pausa;</li>
<li>rifiuto della scrittura a mano e preferenza per attività che non richiedono il gesto grafico;</li>
<li>difficoltà a copiare dalla lavagna in tempi adeguati all'età;</li>
<li>quaderni disordinati, cancellature frequenti, margini e spaziatura non rispettati.</li>
</ul>

<h3>3. La sequenza corretta: chi fa che cosa</h3>
<p>Lo schema previsto dalla Legge 170/2010 procede così:</p>
<table>
<tr><th>Scuola</th><th>Famiglia</th><th>Servizi</th></tr>
<tr><td>Interventi di identificazione precoce dei casi sospetti</td><td></td><td></td></tr>
<tr><td>Attività di recupero didattico mirato</td><td></td><td></td></tr>
<tr><td>Se le difficoltà persistono: comunicazione alla famiglia</td><td>Richiesta di valutazione</td><td>Iter diagnostico</td></tr>
<tr><td></td><td>Comunicazione della diagnosi alla scuola</td><td>Documento di certificazione diagnostica</td></tr>
<tr><td colspan="3">Provvedimenti compensativi e dispensativi — didattica e valutazione personalizzata</td></tr>
</table>
<div class="box norm"><b class="tag">Attenzione al confine</b>È compito delle scuole di ogni ordine e grado, comprese quelle dell'infanzia, attivare interventi tempestivi per individuare i casi sospetti sulla base dei protocolli regionali, previa comunicazione alle famiglie. <b>L'esito di tali attività non costituisce in alcun caso una diagnosi di DSA</b> (L. 170/2010 art. 3 c. 3). La diagnosi è effettuata nell'ambito dei trattamenti specialistici del SSN.</div>

<h3>4. Osservare gli stili di apprendimento</h3>
<p>Un insegnamento che tenga conto dello stile di apprendimento facilita il raggiungimento degli obiettivi per tutti; per un alunno con DSA diventa <b>essenziale e dirimente</b> per il successo scolastico. In fase di consapevolezza il tutor porta lo studente a chiedersi: «come funziono?».</p>
<h4>Domande guida per l'osservazione del metodo</h4>
<ul>
<li>Quali strategie usa spontaneamente: sottolinea, identifica parole chiave, costruisce schemi, tabelle, diagrammi?</li>
<li>Come affronta il testo scritto: computer, schemi, correttore ortografico?</li>
<li>Come svolge il compito assegnato: è autonomo o necessita di azioni di supporto?</li>
<li>Riscrive i testi con modalità grafica diversa?</li>
<li>Usa strategie per ricordare: immagini, colori, riquadrature?</li>
</ul>

<h3>5. Cercare anche i punti di forza</h3>
<p>La consapevolezza non è solo l'inventario delle difficoltà. Elementi da non sottovalutare e da usare come leva:</p>
<div class="grid2">
<div class="card"><ul><li>una buona rete amicale che sostiene lo studente;</li><li>l'autostima già presente in altri ambiti;</li></ul></div>
<div class="card"><ul><li>buone capacità di problem solving;</li><li>passione o buona padronanza dell'informatica.</li></ul></div>
</div>

<h3>6. Griglia di osservazione del gesto grafico</h3>
<p>Da compilare periodicamente per documentare i progressi, non solo le difficoltà:</p>
<table>
<tr><th>Voce</th><th>Cosa annotare</th></tr>
<tr><td>Data e tipo di attività</td><td>scheda di pregrafismo, copia dalla lavagna, dettato…</td></tr>
<tr><td>Impugnatura</td><td>corretta / da correggere / molto rigida / molto lenta</td></tr>
<tr><td>Postura</td><td>appoggio sul tavolo, posizione del foglio, distanza occhi-foglio</td></tr>
<tr><td>Pressione sul foglio</td><td>troppo forte / adeguata / molto leggera</td></tr>
<tr><td>Continuità del tratto</td><td>fluida / con molte interruzioni / con ritorni indietro</td></tr>
<tr><td>Spaziatura e orientamento</td><td>uso del rigo, margini, spazi fra parole</td></tr>
<tr><td>Documentazione</td><td>foto prima/dopo, raccolta dei lavori in portfolio</td></tr>
</table>
<p class="small">Le schede di pregrafismo <b>non sono uno strumento diagnostico</b>, ma forniscono indicazioni preziose agli specialisti.</p>

id:"strumenti", parte:"Strumenti", titolo:"Strumenti compensativi e misure dispensative", durata:"30 min",
html:`
<p class="lead">Gli strumenti compensativi <b>sostituiscono o facilitano</b> la prestazione richiesta nell'abilità deficitaria. Le misure dispensative <b>evitano</b> una prestazione che, a causa del disturbo, è particolarmente faticosa e non migliora l'apprendimento. Confonderli produce PDP inapplicabili.</p>

<h3>1. Strumenti compensativi</h3>
<p>Sono strumenti didattici e tecnologici che sostituiscono o facilitano la prestazione. I più noti:</p>
<ul>
<li><b>sintesi vocale</b>, che trasforma un compito di lettura in un compito di ascolto;</li>
<li><b>registratore</b>, che consente di non scrivere gli appunti della lezione;</li>
<li><b>videoscrittura con correttore ortografico</b>, che permette testi sufficientemente corretti senza l'affaticamento della rilettura e della correzione contestuale;</li>
<li><b>calcolatrice</b>, che facilita le operazioni di calcolo;</li>
<li>strumenti tecnologicamente meno evoluti: tabelle, formulari, mappe concettuali, tavola pitagorica, linea del tempo, retta ordinata dei numeri, tabella dell'alfabeto, tabelle di misure e formule geometriche.</li>
</ul>
<div class="box key"><b class="tag">La formula da citare nei colloqui</b>Tali strumenti «sollevano l'alunno da una prestazione resa difficoltosa dal disturbo, <b>senza peraltro facilitargli il compito dal punto di vista cognitivo</b>». Non regalano nulla: restituiscono le condizioni per essere valutati su ciò che conta.</div>
<p>Si distinguono anche in <b>funzionali</b> (supportano abilità trasversali: formule matematiche, tavola dei verbi) e <b>specifici</b> (supportano direttamente il deficit: calcolatrice, sintesi vocale).</p>
<p class="small">L'utilizzo non è immediato: i docenti, anche sulla base delle indicazioni del referente d'istituto, <b>devono sostenerne l'uso</b>. Uno strumento scritto nel PDP e mai insegnato è uno strumento che non esiste.</p>

<h3>2. Misure dispensative</h3>
<p>Consentono di non svolgere prestazioni che il disturbo rende molto difficoltose e che non migliorano l'apprendimento. Esempio classico: non è utile far leggere a un alunno con dislessia un lungo brano ad alta voce, perché l'esercizio non migliora la sua prestazione nella lettura.</p>
<div class="grid2">
<div class="card"><h4>Primaria</h4><ul>
<li>utilizzo contemporaneo dei quattro caratteri</li>
<li>lettura ad alta voce</li>
<li>scrittura sotto dettatura</li>
<li>prendere appunti, copiare dalla lavagna</li>
<li>studio mnemonico delle tabelline</li>
<li>studio della lingua straniera in forma scritta</li>
<li>rispetto rigido della tempistica di consegna</li>
<li>quantità dei compiti a casa</li>
</ul></div>
<div class="card"><h4>Secondaria</h4><ul>
<li>lettura ad alta voce</li>
<li>scrittura sotto dettatura</li>
<li>prendere appunti, copiare dalla lavagna</li>
<li>tempistica di consegna dei compiti scritti</li>
<li>quantità eccessiva di compiti a casa</li>
<li>più prove valutative in tempi ravvicinati</li>
<li>studio mnemonico di formule, tabelle, definizioni</li>
<li>sostituzione della scrittura con linguaggio verbale o iconografico</li>
</ul></div>
</div>

<h3>3. Il tempo aggiuntivo: quanto?</h3>
<div class="box norm"><b class="tag">Linee guida MIUR</b>Gli studi disponibili consigliano di stimare, tenendo conto degli indici di prestazione dell'allievo, in che misura la difficoltà lo penalizzi rispetto ai compagni, e di calibrare di conseguenza tempo aggiuntivo o riduzione del materiale. <b>In assenza di indici più precisi, una quota del 30% in più appare un ragionevole tempo aggiuntivo.</b></div>
<p>La riduzione del materiale è l'alternativa al tempo aggiuntivo: stesso contenuto disciplinarmente significativo, ma <b>ridotto</b>. Non un contenuto diverso o più facile.</p>
<div class="box alert"><b class="tag">Il limite</b>L'adozione delle misure dispensative va sempre valutata sulla base dell'effettiva incidenza del disturbo, «al fine di non creare percorsi immotivatamente facilitati», e comunque <b>senza differenziare, in ordine agli obiettivi, il percorso di apprendimento</b>. Si cambia il mezzo, non il traguardo.</div>

<h3>4. Software compensativi (elenco AID)</h3>
<h4>Lettura e scrittura</h4>
<table>
<tr><th>Software</th><th>Note</th><th>Distribuzione</th></tr>
<tr><td>LeggiXme_Jr</td><td>sintesi vocale Microsoft, età 6–10</td><td>gratuito</td></tr>
<tr><td>LeggiXme_Sapi5</td><td>per i più grandi; versione su pen drive con PDF-XChange, MindMaple e OCR, senza installazione</td><td>gratuito</td></tr>
<tr><td>FacilitOffice / FacilitOffice Sapi5</td><td>la versione Sapi5 usa la sintesi già presente in Windows</td><td>gratuito</td></tr>
<tr><td>Balabolka</td><td>sintesi vocale non compresa</td><td>gratuito</td></tr>
<tr><td>Superquaderno, Geco, Carlo Mobile Pro, ePico, Personal Reader</td><td>sintesi Loquendo, PDF reader interno</td><td>Anastasis</td></tr>
<tr><td>ALFaReader3</td><td>su pen drive, PDF reader interno</td><td>Erickson</td></tr>
</table>
<h4>Mappe e studio</h4>
<p><span class="pill">VUE</span><span class="pill">CmapTools</span><span class="pill">MindMaple</span><span class="pill">BluMind</span><span class="pill">Mindmodo</span><span class="pill">Canva</span> gratuiti o online — <span class="pill">SuperMappe Classic / Evo</span> (Anastasis) <span class="pill">IperMappe2</span> (Erickson) a pagamento. Per gli appunti: <span class="pill">LiveScribe</span> (hardware + software).</p>
<h4>Matematica</h4>
<p>Primaria: <span class="pill">Incolonnabili</span><span class="pill">Matematica ivana.it</span><span class="pill">In volo con la Matematica</span>. Secondaria: <span class="pill">GeoGebra</span><span class="pill">EffeDiX</span><span class="pill">MateXme</span>. Scrittura matematica: <span class="pill">RedCrab</span><span class="pill">Microsoft Mathematics</span><span class="pill">LibreOffice Math</span><span class="pill">Infty Editor</span><span class="pill">MateMitica</span>. Gioco educativo: <span class="pill">TuxMath</span>. Software liberi per il conteggio e la logica: <span class="pill">GCompris</span> (2–10 anni).</p>
<h4>Supporto</h4>
<p>PDF reader: <span class="pill">PDF-XChange Editor</span><span class="pill">Foxit</span><span class="pill">Nitro</span><span class="pill">Adobe</span> — OCR: <span class="pill">Capture2Text</span><span class="pill">FreeOCR</span><span class="pill">OmniPage</span> — Dettatura: <span class="pill">Dragon Naturally Speaking</span> — Audio: <span class="pill">Audacity</span> — Semplificazione testi per docenti: <span class="pill">Faciltesto</span>.</p>
<h4>Addestramento alla tastiera</h4>
<p><span class="pill">TuxTyping</span><span class="pill">Keyzard</span> (6–12) — <span class="pill">10dita</span><span class="pill">Tutoredattilo</span> (12+) — <span class="pill">Scrivere veloci con la tastiera</span> (Erickson).</p>
<p class="small">Saper usare la tastiera in modo fluido è un prerequisito spesso trascurato: senza di esso il computer diventa un secondo ostacolo invece di un compensativo.</p>

<h3>5. Strumenti per la scrittura a mano</h3>
<ul>
<li><b>matite triangolari</b>: guidano naturalmente la presa a pinza di pollice, indice e medio;</li>

<li><b>grip in silicone</b> da applicare su matite e penne;</li>
<li><b>penne gel o roller</b> a scorrimento fluido: richiedono meno pressione;</li>
<li>quaderni con rigatura facilitata, righelli guida, mascherine, segnalibri, modelli di lettera plastificati.</li>
</ul>
<div class="box"><b class="tag">Nessuna penna magica</b>La scelta dello strumento è individualizzata: non esiste la penna giusta in assoluto, ma quella più adatta alla mano e alle esigenze di quel bambino.</div>

<h3>6. Font e leggibilità</h3>
<p>Per le verifiche e i materiali: caratteri <b>sans-serif</b>, dimensione 14–16 pt, spaziatura generosa, parole chiave evidenziate, istruzioni passo per passo. Font ad alta leggibilità disponibili: <b>OpenDyslexic</b> (gratuito) ed <b>EasyReading</b>. Un docente di liceo che ha adottato Open-Dyslexic per tutte le verifiche ha somministrato lo stesso formato all'intera classe: nessuno si è sentito diverso e la leggibilità è migliorata per tutti.</p>

id:"lettura", parte:"Didattica", titolo:"Lettura: dal fonema al testo", durata:"30 min",
html:`
<p class="lead">L'insegnamento sistematico della corrispondenza fra lettere e suoni è ciò che trasforma davvero il circuito corticale della lettura (Stanislas Dehaene). Non è una tecnica fra le altre: è il fondamento su cui si innestano tutte le altre.</p>

<h3>1. Perché partire dal suono e non dal nome della lettera</h3>
<p>Il bambino che impara che quella lettera «si chiama emme» deve poi fare un secondo passaggio per capire che nella parola fa <i>mmm</i>. Partendo dal fonema il passaggio è uno solo. Ecco un percorso in cinque lezioni, replicabile su qualsiasi consonante.</p>

<h4>Lezione 1 — Il suono delle lettere</h4>
<ul>
<li><b>Obiettivo</b>: far capire che le lettere fanno dei suoni; sperimentare alcuni suoni consonantici (m, s, l).</li>
<li>Gioco dei suoni misteriosi: l'insegnante pronuncia solo il suono (mmm, sss, lll), i bambini imitano.</li>
<li>Ricerca del suono nelle parole: «mamma, sole, luna, mano» — alzano la mano se sentono <i>mmm</i>.</li>
<li>Collego suono e lettera: mostro la M e dico che fa <i>mmm</i>, <b>senza usare il nome della lettera</b>.</li>
</ul>
<h4>Lezione 2 — Scopro la M</h4>
<ul>
<li>Revisione collettiva del suono, prolungandolo.</li>
<li>Schede con immagini (mela, mano, mamma) per riconoscere le parole che iniziano con m.</li>
<li>Gioco motorio: salto quando sento una parola con m, resto fermo se non la sento.</li>
</ul>
<h4>Lezione 3 — Dalla M alle sillabe</h4>
<ul>
<li>Gioco orale: l'insegnante dice <i>mmm</i> + a = ? I bambini rispondono <b>ma</b>.</li>
<li>Tessere con M e vocali per formare MA ME MI MO MU.</li>
<li>Gioco del trenino: un bambino fa <i>m</i>, un altro <i>a</i>, insieme diventano <i>ma</i>. È la <b>fusione fonemica</b>, il passaggio più delicato.</li>
</ul>
<h4>Lezione 4 — Paroline con M</h4>
<ul>
<li>Raccolta delle sillabe conosciute alla lavagna.</li>
<li>Lettura di MAMMA, MELA, MARE, MANO con piccolo disegno accanto.</li>
<li>Frasi dense di M da leggere insieme: «Mimmo ama la mamma e la mela».</li>
</ul>
<h4>Lezione 5 — Estendo il metodo</h4>
<ul>
<li>Ripresa esplicita del percorso: prima il suono, poi le parole, poi le sillabe.</li>
<li>Nuove lettere introdotte solo con il loro suono (sss, lll, ppp) e immagini collegate.</li>
<li>Giochi di discriminazione: se senti <i>m</i> tocca la testa, se senti <i>s</i> tocca il naso.</li>
</ul>

<h3>2. Progressione per la primaria</h3>
<table>
<tr><th>Classe</th><th>Focus</th><th>Attività tipo</th></tr>
<tr><td><b>1ª</b> — avvio</td><td>riconoscimento lettere, sillabe CV, parole con immagine</td><td>tracciare la lettera con il dito e colorare; sillabe con codice colore (consonanti blu, vocali rosse); associare parola e immagine con frecce</td></tr>
<tr><td><b>2ª</b> — parole e frasi brevi</td><td>parole trisillabiche, completamento, frasi con immagini</td><td>dividere in sillabe colorando ogni sillaba; completare _ANA → RANA con immagine di aiuto; ritagliare parole e ricomporre la frase</td></tr>
<tr><td><b>3ª</b> — comprensione</td><td>frasi più lunghe, verifica facilitata, sequenze</td><td>abbinare frase e immagine; domande a scelta multipla con immagini; ordinare le sequenze illustrate e ricostruire la storia</td></tr>
<tr><td><b>4ª</b> — parole complesse</td><td>digrammi e trigrammi CHI GHI SCI GLI</td><td>leggere e colorare parole con digrammi; testo breve con mappa visiva; «individua l'errore» in frasi con errori evidenti</td></tr>
<tr><td><b>5ª</b> — lettura autonoma guidata</td><td>parole chiave, domande graduate, produzione facilitata</td><td>parole chiave in grassetto, sottolineare verbi e cerchiare nomi; domande a scelta multipla e libere; scrivere una frase da un'immagine con guida Chi? Cosa fa? Dove?</td></tr>
</table>
<div class="box key"><b class="tag">Strumenti trasversali presenti in ogni scheda</b>font ad alta leggibilità (EasyReading, OpenDyslexic) · colori per sillabe o categorie grammaticali · immagini e simboli ARASAAC, linee del tempo, mappe · materiali manipolativi: lettere mobili, carte sillabe.</div>

<h3>3. Sette principi per insegnare a un bambino dislessico</h3>
<ol>
<li><b>Approccio multisensoriale</b> — consapevolezza fonologica, fonetica, elementi visivi, bigliettini, vassoi di sabbia per scrivere lettere e parole, attività ricreative, musica.</li>
<li><b>Essere diretti ed espliciti</b> — istruzioni chiare e feedback per tutta la durata del procedimento; informazioni in ordine logico; ripetere spesso i concetti; quando si passa a una competenza nuova continuare a ripetere le precedenti per stabilire connessioni.</li>
<li><b>Insegnamento diagnostico</b> — verificare spesso il livello di comprensione, dare tempi più lunghi e istruzioni più accattivanti, sviluppare strategie sulla base di una valutazione dello studente.</li>
<li><b>Sfruttare il tempo con intelligenza</b> — non andare di fretta, programmare intervalli regolari, tempi di consegna adeguati, non modificare la routine quotidiana.</li>
<li><b>Sfruttare altre risorse</b> — consultare lo studente, coinvolgere la classe, creare collaborazione, usare strumenti tecnologici.</li>
<li><b>Emozioni</b> — lavorare su consapevolezza, autostima e stato emotivo dello studente.</li>
<li><b>Ambiente</b> — vedi sotto.</li>
</ol>
<h4>Sette modifiche all'ambiente di classe</h4>
<div class="grid2">
<div class="card"><ol><li>far sedere lo studente vicino all'insegnante;</li><li>consentire l'uso di dispositivi di registrazione;</li><li>distribuire dispense;</li><li>usare formati diversi per le verifiche;</li></ol></div>
<div class="card"><ol start="5"><li>ridurre al minimo la necessità di copiare dati;</li><li>predisporre strumenti che favoriscano l'organizzazione;</li><li><b>non concentrarsi sulla qualità della grafia</b>.</li></ol></div>
</div>
<h4>Modifiche ai compiti assegnati</h4>
<ul>
<li>ridurre il gruppo di domande; usare domande a crocette; lavorare per concetti chiave;</li>
<li>colloqui in forma orale con supporto di immagini;</li>
<li>mettere a disposizione schede didattiche ogni settimana;</li>
<li>consentire quaderni a quadretti più grandi anche alle superiori;</li>
<li>utilizzare oggetti quando si spiega; far utilizzare audiolibri.</li>
</ul>

<h3>4. Adattamenti valutativi per la lettura</h3>
<ul>
<li>non valutare solo la correttezza ortografica, ma i contenuti;</li>
<li>privilegiare prove orali rispetto alle scritte;</li>
<li>consentire l'uso di mappe durante le prove;</li>
<li>dividere i compiti in step per ridurre l'ansia da prestazione;</li>
<li>parlare lentamente e scandendo bene; evidenziare le parole chiave; dare istruzioni passo per passo;</li>
<li>incoraggiare e valorizzare i progressi, non solo i risultati.</li>
</ul>
<blockquote>La dislessia non è un limite cognitivo, ma una differente modalità di apprendimento. Il ruolo del docente è centrale, come facilitatore.</blockquote>
`,

id:"disgrafia", parte:"Didattica", titolo:"Disgrafia: impugnatura, pregrafismo, compensazione", durata:"30 min",
html:`
<p class="lead">La disgrafia riguarda il gesto, non la volontà. Si interviene su postura, presa, direzionalità e fluidità <b>prima</b> di chiedere lunghe scritture — e si compensa quando la scrittura manuale è troppo faticosa.</p>

<h3>1. L'impugnatura corretta</h3>
<ul>
<li>la mano è appoggiata sul foglio, con il mignolo che scivola <b>come un piccolo binario</b>;</li>
<li>avambraccio e gomito poggiati al tavolo, per garantire stabilità al gesto;</li>
<li>la mano che non scrive tiene fermo il foglio;</li>
<li>matita o penna prese <b>a pinza</b> fra pollice e indice, con il medio che sostiene lo strumento;</li>
<li>la presa è salda ma non rigida: permette movimenti fluidi e controllati.</li>
</ul>
<h4>Tre impugnature scorrette da riconoscere</h4>
<table>
<tr><th>Nome</th><th>Come si presenta</th></tr>
<tr><td><b>A morso</b></td><td>la mano stringe fortemente lo strumento, pollice e indice lo "mordono"</td></tr>
<tr><td><b>Del fumatore</b></td><td>la penna è tenuta fra indice e medio, pollice distante e poco controllo</td></tr>
<tr><td><b>Pollice in avanti</b></td><td>il pollice copre le dita e limita il movimento fine delle altre</td></tr>
</table>
<p>Queste prese provocano fatica, dolore alla mano e grafia poco controllata.</p>
<div class="box norm"><b class="tag">Perché intervenire presto</b>All'impugnatura va prestata attenzione <b>fin dalla scuola dell'infanzia</b>. Correggere precocemente una presa scorretta evita che il bambino automatizzi schemi motori poco funzionali. Spesso l'osservazione viene rimandata alla primaria: a quel punto il gesto è già più rigido e il cambiamento più faticoso.</div>

<h3>2. Il pregrafismo come palestra del gesto</h3>
<p>Attraverso linee, percorsi, curve e figure semplici il bambino allena motricità fine, direzionalità del tratto, coordinazione occhio-mano e controllo della pressione. Le schede <b>non sono compiti da finire</b>, ma occasioni per sperimentare il piacere del segno e del movimento.</p>
<h4>Tipologie di scheda</h4>
<ul>
<li>percorsi da seguire: strade, labirinti, piste per macchinine o animali;</li>
<li>linee rette, ondulate, spezzate, cerchi e ghirlande da ripassare più volte, <b>variando velocità e pressione</b>;</li>
<li>sequenze di forme semplici (cerchi, quadrati, triangoli) rispettando dimensione e posizione;</li>
<li>puntini da unire, per allenare continuità del tratto e pianificazione del percorso;</li>
<li>ombre da ricalcare: sagome ripassate prima con il dito, poi con la matita;</li>
<li>linee verticali e orizzontali seguendo la direzione indicata (su-giù, destra-sinistra);</li>
<li>percorsi a zig-zag senza staccare la mano;</li>
<li>spaziatura regolare: linee da un quadrato all'altro mantenendo sempre la stessa distanza;</li>
<li>archetti e ghirlande seguendo il verso della freccia;</li>
<li>tratti leggeri e marcati: ripassare la stessa figura con pressione LEGGERA, MEDIA, FORTE.</li>
</ul>
<h4>Come proporle</h4>
<ul>
<li>clima sereno e giocoso; mai «schede da finire»;</li>
<li>dai tracciati semplici (linee rette, percorsi larghi) a quelli complessi;</li>
<li>osservare impugnatura, controllo della pressione, movimento sul foglio;</li>
<li>lodare l'impegno e i piccoli progressi, non solo l'estetica del risultato;</li>
<li><b>interrompere</b> se compaiono stanchezza o frustrazione e riprendere in un altro momento.</li>
</ul>
<h4>Adattare all'età</h4>
<table>
<tr><th>Livello</th><th>Come</th></tr>
<tr><td>Infanzia</td><td>pochi tracciati per volta, grandi spazi, pennarelli o matitoni morbidi</td></tr>
<tr><td>1ª primaria</td><td>aumentare progressivamente lunghezza dei percorsi e precisione richiesta</td></tr>
<tr><td>Classi successive</td><td>usare le schede come riscaldamento prima della scrittura o per abilità specifiche</td></tr>
<tr><td>Maggiori difficoltà</td><td>ridurre la quantità, aumentare le pause, privilegiare tracciati guidati</td></tr>
</table>
<p class="small">Ogni bambino ha un ritmo personale: si confronta il bambino con sé stesso, non con gli altri.</p>

<h3>3. Sequenza di intervento sul gesto grafico</h3>
<ol>
<li><b>Distensione motoria</b> — facilitare postura e prensione dello strumento grafico, prima causa di un gesto inadeguato.</li>
<li><b>Percezione spaziale</b>, <b>macrografia</b> e <b>pittografia</b>, per acquisire le coordinate dello spazio grafico e migliorare scioltezza e coordinazione.</li>
<li><b>Pregrafismo</b> che prepara ai gesti tipici delle lettere in corsivo.</li>
<li><b>Lettere del corsivo</b> suddivise per «famiglie», secondo il gesto di base che hanno in comune.</li>
<li>Insegnare <b>analiticamente i movimenti</b>, favorendo attenzione, osservazione, consapevolezza e memorizzazione, <i>prima</i> della realizzazione pratica; poi perfezionare gradualmente tracciato e precisione.</li>
</ol>
<div class="box key"><b class="tag">Principio</b>Partire dal <b>gesto</b> per arrivare alla forma, e non viceversa: la forma è il risultato finale, non il punto di partenza.</div>

<h3>4. Da comportamento osservato a esercizio correttivo</h3>
<table>
<tr><th>Comportamento rilevato</th><th>Esercizi correttivi</th></tr>
<tr><td>La mano scorre con fatica sul piano di scrittura; il polso non appoggia; il busto è eccessivamente inclinato; la mano libera non tiene fermo il quaderno; impugnatura scorretta; non si usa sempre la stessa mano</td><td>Esercizi svolti <b>prima con il corpo</b>, poi verbalizzati, poi messi su carta. Dimostrazione della prestazione grafomotoria anche con video. Controllo della respirazione: archi dal più piccolo al più grande e viceversa come rappresentazione grafica di sequenze di respiri.</td></tr>
<tr><td>Difficoltà a scrivere senza staccare la penna; a seguire il piano di scrittura; a rispettare i margini; a seguire una linea retta; righe oscillanti o interrotte; difficoltà anche nel riprodurre figure geometriche</td><td>Esercizi mirati alla <b>fluidità</b>, che chiedono di staccare sempre meno la penna. Percorsi di forme ("e", "el") da ripassare o riprodurre <b>da sinistra a destra e in senso antiorario</b>, poi eseguiti per forma o per velocità.</td></tr>
</table>
<h4>Due tecniche da distinguere</h4>
<ul>
<li><b>Tracing</b> — si chiede al bambino di passare con la penna sopra figure già tracciate.</li>
<li><b>Coping</b> — si dà il modello e il bambino lo deve copiare.</li>
</ul>

<h3>5. Compensare quando serve</h3>
<ul>
<li>ridurre la quantità di testo da scrivere in dettati e copiature;</li>
<li>ridurre o adattare il carico di appunti: schemi forniti dall'insegnante, mappe, slide stampate;</li>
<li>più tempo per i compiti che prevedono produzione scritta, in classe e nelle verifiche;</li>
<li>tablet o computer al posto della grafia manuale, quando necessario;</li>
<li>videoscrittura con correttore ortografico e possibilità di ingrandire caratteri e spazi;</li>
<li>quaderni con rigatura facilitata, righe colorate, modelli di lettera, righelli guida.</li>
</ul>
<div class="box"><b class="tag">Quando si fa diagnosi</b>La diagnosi di disgrafia viene in genere effettuata <b>verso la fine della seconda primaria</b>. Prima di quel momento una grafia faticosa non è di per sé indice di disgrafia: la scuola ha il ruolo di monitorare le abilità grafo-motorie e potenziarle con attività mirate.</div>

<h3>6. Parlarne ai genitori</h3>
<ul>
<li>linguaggio chiaro e non tecnico, senza etichette negative;</li>
<li>la disgrafia <b>non è pigrizia né mancanza di impegno</b>;</li>
<li>l'intelligenza è nella norma: il disturbo riguarda il gesto grafico;</li>
<li>con strategie adeguate e collaborazione è possibile migliorare molto;</li>
<li>invitare a fare domande e a condividere le preoccupazioni.</li>
</ul>
<h4>Che cosa possono osservare a casa</h4>
<p>Se il bambino si stanca molto presto scrivendo a mano; se evita volontariamente compiti di scrittura lunga; se lamenta dolore a mano, polso o braccio; se i quaderni domestici sono molto disordinati; se è molto più sereno quando può usare computer o tablet.</p>
<h4>Come sostenerlo nei compiti</h4>
<ul>
<li>spezzare i compiti scritti in piccole parti, con brevi pause concordate;</li>
<li>ambiente tranquillo, tavolo stabile, sedia adeguata, buona illuminazione;</li>
<li>verificare impugnatura e postura <b>senza essere troppo rigidi</b>;</li>
<li>accogliere le difficoltà senza rimproveri, rinforzando l'impegno più del risultato grafico;</li>
<li>accettare l'uso degli strumenti compensativi concordati con la scuola.</li>
</ul>

id:"discalculia", parte:"Didattica", titolo:"Discalculia: capire gli errori prima di correggerli", durata:"40 min",
html:`
<p class="lead">Con la discalculia il lavoro del tutor ha una sequenza obbligata: <b>identificare il processo deficitario</b> → <b>capire quale sistema è compromesso</b> → <b>scegliere l'intervento</b>. Saltare i primi due passi produce esercizi a caso.</p>

<h3>1. L'architettura: tre livelli</h3>
<table>
<tr><th>Livello</th><th>Componenti</th><th>Che cosa fa</th></tr>
<tr><td><b>Senso del numero</b><br><span class="small">sistemi pre-verbali innati</span></td><td>OTS e subitizing; ANS e acuità numerica</td><td>Fino a 3–4 elementi rispondiamo in modo rapido e preciso (subitizing). Oltre, forniamo una stima lenta e meno precisa (ANS). L'acuità numerica è la capacità di discriminare insiemi con numerosità diverse.</td></tr>
<tr><td><b>Sistema del numero</b><br><span class="small">abilità di conteggio</span></td><td>processi semantici, lessicali, sintattici</td><td>Vedi sotto.</td></tr>
<tr><td><b>Sistema del calcolo</b><br><span class="small">abilità verbali apprese</span></td><td>segni, procedure, fatti numerici</td><td>Decodificare il segno; applicare la procedura; recuperare a memoria i risultati di base.</td></tr>
</table>
<p class="small">I bambini con discalculia evolutiva hanno una minore capacità di subitizing (Schleifer e Landerl, 2011). Un deficit nell'individuare piccole quantità in modo esatto rende più difficile automatizzare il conteggio e indebolisce il legame fra parola-numero e significato.</p>

<h4>I tre processi del sistema del numero</h4>
<div class="grid2">
<div class="card"><h4>Semantici</h4><p>Comprendere il significato dei numeri attraverso una rappresentazione mentale quantitativa: collegare la parola «tre» al concetto di «tre elementi». Si valutano con <b>comparazione</b> e <b>seriazione</b>.</p></div>
<div class="card"><h4>Lessicali</h4><p>Attribuire il nome ai numeri traducendo dal codice arabico al verbale o scritto e viceversa (codifica bidirezionale). Si valutano con <b>lettura</b> e <b>dettato</b> di numeri. Nella discalculia la codifica è più lenta anche quando la nominazione è corretta.</p></div>
<div class="card"><h4>Sintattici</h4><p>La grammatica del sistema posizionale: una cifra assume valore diverso a seconda della posizione. Si valuta con l'<b>abaco</b>, per esempio facendo scrivere il numero corrispondente a una configurazione.</p></div>
<div class="card"><h4>Fatti numerici</h4><p>Operazioni di base di cui si conosce il risultato a memoria. Si passa da oggetti concreti (le dita) al calcolo mentale, fino alla disponibilità in memoria a lungo termine. All'inizio sono ripetuti come filastrocche (tabelline).</p></div>
</div>

<h3>2. Riconoscere gli errori</h3>
<h4>Errori nei processi semantici → discalculia profonda</h4>
<p>Difficoltà a identificare, discriminare e manipolare insiemi con quantità diverse. Non riuscire a collegare il numero arabo alla giusta quantità: non identificare il maggiore fra 35 e 42; non ordinare in senso crescente o decrescente.</p>
<h4>Errori nel sistema numero → discalculia procedurale</h4>
<ul>
<li><b>a base lessicale</b> — produzione delle singole cifre: leggo, scrivo o dico 5 al posto di 8;</li>
<li><b>a base sintattica</b> — rapporto fra cifre: codifico correttamente la cifra ma non riconosco il valore posizionale. Attenzione allo <b>0</b>, che non si pronuncia ma va scritto e ha valore posizionale: «duemilacentocinque» scritto <b>20001005</b>.</li>
</ul>
<h4>Errori nel sistema del calcolo</h4>
<table>
<tr><th>Tipo di errore</th><th>Esempi</th></tr>
<tr><td>Recupero di fatti aritmetici</td><td>6×8=54 (sbaglio di una posizione); 6×8=14 (confusione dovuta all'attivazione automatica delle procedure indipendentemente dal segno); 3×0=3, confondendo n×0=0 con n+0=n</td></tr>
<tr><td>Mantenimento e recupero delle procedure</td><td>mancato uso delle procedure facilitanti; per fare 2+6 parte dal 2 anziché dal 6; non mantiene attivi i risultati parziali</td></tr>
<tr><td>Applicazione delle procedure</td><td>errori di incolonnamento e posizionamento (soprattutto con i decimali); effettua il prestito ma non toglie la decina; continua a usare il riporto anche quando non serve</td></tr>
<tr><td>Memoria di lavoro</td><td>quando i fatti aritmetici non sono consolidati, ogni calcolo richiede uno sforzo cognitivo maggiore e servono tabelle compensative</td></tr>
</table>

<h3>3. Che cosa fare davanti a un errore specifico</h3>
<h4>Errore nel riconoscimento del segno</h4>
<ul>
<li>attività sul significato dei singoli segni (gioco dei dadi in cui devo aggiungere i risultati);</li>
<li>giochi sui segni opposti: disegno + e – su due cartoncini; a seconda di quello estratto il bambino prende (+) o cede (–) degli oggetti;</li>
<li>inventare giochi in cui se vince addiziona o moltiplica i punteggi, se perde sottrae;</li>
<li>far eseguire operazioni <b>senza segno</b>: 4 __ 2 = 6, il bambino deve indovinare quale;</li>
<li>lavorare con gli insiemi (4 caramelle da cui ne tolgo 3) o sulla linea dei numeri (parto da 4, vado indietro di 3, arrivo a 1), oppure con gioco dell'oca, percorsi, dadi.</li>
</ul>
<h4>Errori nelle procedure di calcolo</h4>
<ul>
<li>far evidenziare <b>sempre</b> le cifre da riportare e quelle chieste in prestito;</li>
<li>proporre molte sottrazioni con presenza di 0 e 9;</li>
<li>usare simboli e <b>frecce colorate</b> che orientino spazialmente e sequenzialmente: con più di due cifre al minuendo il bambino può non capire a quale cifra chiedere per prima il prestito;</li>
<li>esplicitare la direzionalità: addizione e sottrazione da destra a sinistra e dall'alto verso il basso; nella moltiplicazione si parte dal moltiplicatore, quindi dal basso verso l'alto ma sempre da destra a sinistra;</li>
<li>usare griglie per orientarsi nel calcolo mentale.</li>
</ul>
<h4>Esercizi sulla linea dei numeri</h4>
<p>Svolti prima sulla linea, poi oralmente, infine per iscritto: contare avanti e indietro per uno entro il 100; inserire numeri mancanti; ricostruire la sequenza dopo aver osservato la linea; trovare il numero che precede e quello che segue. La linea serve anche a <b>correggere</b>: se confonde 67 con 77, si fa osservare e scrivere la sequenza da 70 a 80 e si chiede di individuare il 67.</p>

<h3>4. Strategie per l'ambito numerico</h3>
<table>
<tr><th>Strategia</th><th>Vantaggi</th><th>Svantaggi</th></tr>
<tr><td><b>Auto-istruzioni</b></td><td>maggiore attivazione e motivazione; consapevolezza dei propri ragionamenti; sfrutta il canale uditivo</td><td>l'insegnante non può valutarne l'efficacia; serve autocontrollo (<b>non adatta all'ADHD</b>); richiede consapevolezza metacognitiva</td></tr>
<tr><td><b>CRA</b> concrete-representational-abstract</td><td>comprensione di concetti astratti tramite rappresentazioni concrete e visive; connessione con esperienze personali; costruzione graduale; canale cinestetico</td><td>troppo facile per chi ha già compreso; rischio di creare misconcezioni</td></tr>
<tr><td><b>Istruzioni esplicite</b></td><td>tutto scritto davanti a sé; chiarezza e accuratezza</td><td>monotonia; limitazione della creatività; poca scoperta e indipendenza</td></tr>
<tr><td><b>Istruzioni sistematiche e schemi</b></td><td>riduzione della complessità; identificazione di schemi ricorrenti; suddivisione in fasi</td><td>rischio di tralasciare informazioni rilevanti, creare schemi sbagliati, semplificare troppo</td></tr>
<tr><td><b>Gesti e memorizzazione su carta</b></td><td>pensiero più chiaro; ricordo delle strutture comuni dei problemi; alleggerisce la memoria di lavoro; canale cinestetico e visivo</td><td>—</td></tr>
</table>

<h3>5. I cinque principi del contare (Gelman e Gallistel, 1978)</h3>
<ol>
<li><b>Corrispondenza uno a uno</b> — contare una sola volta ogni elemento, assegnando un solo cartellino numerico.</li>
<li><b>Ordine stabile</b> — l'etichetta numerica segue sempre lo stesso ordine (1 viene sempre prima di 2).</li>
<li><b>Cardinalità</b> — il numero di elementi corrisponde all'ultimo numero usato per contarli.</li>
<li><b>Astrazione</b> — il numero è indipendente dalle qualità dei membri: 5 caramelle e 5 libri sono sempre 5.</li>
<li><b>Irrilevanza dell'ordine</b> — contando da destra o da sinistra il risultato non cambia.</li>
</ol>

<h3>6. Tecniche di calcolo che funzionano</h3>
<div class="box key"><b class="tag">Le dita non sono un ripiego</b>Contrariamente a quanto si pensa, le dita sono un ottimo strumento di supporto al calcolo: vanno incoraggiate, perché è impossibile memorizzare l'enorme quantità di informazioni della matematica, e per un bambino discalculico quella memorizzazione è di fatto preclusa.</div>
<h4>Addizione: partire dall'addendo maggiore</h4>
<p>Insegnare la proprietà commutativa come strumento compensativo: per 5 + 18 si parte da 18 e si aggiunge 5. Con le dita: «metto 18 in testa e 5 sulle dita, vai avanti e dimmi a quale numero arrivi», fermandosi al quinto dito.</p>
<h4>Tabelline: la tavola pitagorica cinese</h4>
<p>Elimina tutte le ridondanze: non si impara la tabellina dell'1, e non si imparano sia 3×5 sia 5×3. Si impara 5×3 nella tabellina del 3; la tabellina del 5 comincia da 5×5. <b>Il carico mnemonico scende da 81 a 36 dati</b> e il bambino capisce che 3×5 e 5×3 sono equivalenti (Butterworth, <i>Intelligenza matematica</i>).</p>
<h4>Se anche 36 dati sono troppi: partire dal 5</h4>
<p>La tabellina più facile è quella del 5, perché alterna 0 e 5 e fa crescere le decine in ordine progressivo. Una volta memorizzata:</p>
<ul>
<li>moltiplicatore <b>maggiore</b> di 5 → 6×8: faccio 5×8 = 40, poi aggiungo 8 → 48. 8×7: 5×7 = 35, poi +7 +7 +7 → 56.</li>
<li>moltiplicatore <b>minore</b> di 5 → 4×8: faccio 5×8 = 40, tolgo 8 → 32. 3×9: 5×9 = 45, tolgo 9 e 9 → 27. 2×6: 5×6 = 30, tolgo 6, 6, 6 → 12.</li>
<li>poi si aggiunge la commutativa: 8×7 diventa 7×8 (5×8 = 40; 40+8+8 = 56).</li>
</ul>
<p>Si possono infine insegnare risultati memorizzabili per assonanza: 6×8 = 48 «asino cotto»; 6×4 = 24 «ho mangiato un gatto». Attenzione però: l'associazione con rime <b>non deve complicare il compito</b>. Sta all'insegnante verificarlo osservando quel bambino.</p>
<h4>Calcolo mentale per scomposizione</h4>
<p>35 + 12 = (30+10) + (5+2) = 40 + 7 = 47. Analogamente 37 − 16 = (30−10) + (7−6) = 21. Attenzione: questa procedura usa due operazioni per arrivare a un risultato e può confondere; se accade, meglio lasciar perdere e riproporla più avanti. Variante più leggera: scomporre <b>un solo</b> addendo, 27 + 14 = (27+10) + 4 = 41.</p>
<p>Questi esercizi vanno preceduti da un buon allenamento sulle decine (contare per 10 avanti e indietro) e servono a far <b>abbandonare l'immagine dell'operazione in colonna</b>: i discalculici spesso immaginano la colonna e la eseguono mentalmente passo per passo, con alto rischio di errore.</p>
<div class="box"><b class="tag">Non solo calcolatrice</b>Accanto all'uso della calcolatrice va mantenuta una serie di calcoli scritti: servono a dare indipendenza nella vita quotidiana, perché non sempre la calcolatrice è disponibile.</div>

<h3>7. Strumenti compensativi per il calcolo</h3>
<ul>
<li><b>calcolatrice</b> scientifica o parlante;</li>
<li><b>abaco</b>, anche cartaceo, per includere i decimali;</li>
<li><b>tavola pitagorica</b>: a scuola in genere 0–10 o 0–12, ma per chi ha molte difficoltà, e soprattutto per le divisioni, è più utile la <b>0–99</b>;</li>
<li><b>tabelline cinesi</b>;</li>
<li><b>fogli compensativi</b> per le operazioni in colonna;</li>
<li><b>linea dei numeri</b>, anche nel metodo analogico di Camillo Bortolato;</li>
<li><b>mappe e formulari</b>, meglio se costruiti dai ragazzi stessi.</li>
</ul>

<h3>8. Funzioni esecutive: allenarle giocando</h3>
<p>Tre abilità dominio-generali sono coinvolte in tutta la matematica: <b>memoria di lavoro</b> (mantenimento momentaneo delle informazioni), <b>funzioni esecutive</b> (pianificazione, controllo, coordinazione) e <b>velocità di elaborazione</b>, precursore altamente implicato nello sviluppo delle abilità matematiche precoci. I bambini con scarse abilità matematiche mostrano scarsa flessibilità cognitiva e tendenza a perseverare nelle risposte.</p>
<table>
<tr><th>Funzione</th><th>Che cosa fa</th></tr>
<tr><td>Memoria di lavoro</td><td>trattenere le informazioni necessarie a svolgere il compito</td></tr>
<tr><td>Attenzione</td><td>mantenere il focus fino al completamento</td></tr>
<tr><td>Inibizione</td><td>controllare l'interferenza di stimoli irrilevanti</td></tr>
<tr><td>Flessibilità</td><td>cambiare strategia in corso d'opera quando serve</td></tr>
</table>
<h4>Giochi da tavolo riadattati</h4>
<ul>
<li><b>UNO</b> — <i>calcolo e memoria di lavoro</i>: sommare i numeri consecutivi, sommare con il precedente, sommare le prime due carte e sottrarre la terza, moltiplicare. <i>Inibizione</i>: dire i numeri quando escono carte di un certo colore e nominare solo il colore per le altre. <i>Doppio compito</i>: toccarsi il naso e nominare il numero solo quando compare un numero scelto. <i>Flessibilità</i>: nominare i colori, ma al segnale passare ai numeri.</li>
<li><b>Dobble</b> — attenzione e velocità di elaborazione; usare le varianti a rotazione; è anche esercizio di riconoscimento e denominazione.</li>
<li><b>Tip Top Clap</b> (in gruppo) — memoria: ogni giocatore gira una carta che rappresenta un gesto e deve ripetere il gesto precedente prima di eseguire il proprio; la sequenza si allunga fino all'errore.</li>
</ul>
<p class="small">Potenziare le funzioni esecutive alleggerisce il carico cognitivo, moltiplica le esperienze di successo in tutte le materie, aumenta autoefficacia e autostima e incrementa la motivazione.</p>

<h3>9. Attività prescolari</h3>
<ul>
<li>far corrispondere il gesto del contare alla parola-numero;</li>
<li>posizionare gli oggetti da contare in modo ordinato e ben distanziati;</li>
<li>giochi in cui si usa il conteggio (giochi da tavolo, il mercato);</li>
<li>giochi e piattaforme interattive alla lavagna digitale;</li>
<li><b>LEGO</b>: visualizzare quantità, maggiore e minore, memorizzare sequenze, contare;</li>
<li><b>tappeto puzzle con numeri</b>: riconoscimento dei numeri, apprendimento in movimento (saltare da un numero all'altro, gioco della campana) e tattile, perché ogni numero si estrae dalla tessera.</li>
</ul>

<h3>10. Difficoltà o disturbo?</h3>
<table>
<tr><th>Difficoltà</th><th>Disturbo</th></tr>
<tr><td>metodo di insegnamento sbagliato; attraversa fasi transitorie; "ritardo" nelle competenze; miglioramento con intervento adeguato</td><td>assenza di patologie neurologiche; intelligenza nella norma o superiore; miglioramento lento e parziale nonostante gli aiuti</td></tr>
</table>
<div class="box norm"><b class="tag">Quando si fa diagnosi</b>La diagnosi di discalculia non dovrebbe essere effettuata <b>prima della fine della terza primaria</b>: l'apprendimento delle abilità matematiche è complesso e graduale. È però possibile individuare alcuni precursori già in età prescolare.</div>
<p class="small">Letture consigliate: Butterworth e Yeo, <i>Didattica per la discalculia</i> (Erickson); Lucangeli, De Candia, Poli, <i>L'intelligenza numerica</i> (Erickson); Demarchi, <i>Tablet delle regole di matematica</i> (Erickson); Biancardi, Mariani, Pieretti, <i>La discalculia evolutiva</i> (Franco Angeli).</p>

html:`
<p class="lead">Il PEI accompagna un percorso educativo a lungo termine per alunni con disabilità certificata; il PDP è annuale e serve a rendere esplicito e verificabile ciò che la scuola fa per un alunno con DSA o BES. Scambiarli è l'errore più frequente nei consigli di classe.</p>

<h3>1. Confronto</h3>
<table>
<tr><th></th><th>PEI — Piano Educativo Individualizzato</th><th>PDP — Piano Didattico Personalizzato</th></tr>
<tr><td>A chi</td><td>alunni con disabilità certificata</td><td>alunni con DSA certificati o BES anche non certificati</td></tr>
<tr><td>Norma</td><td>L. 104/1992 (e D.Lgs. 66/2017, 96/2019)</td><td>L. 170/2010, D.M. 5669/2011; Dir. 27/12/2012 e C.M. 8/2013 per i BES</td></tr>
<tr><td>Orizzonte</td><td>lungo termine, aggiornato periodicamente</td><td>breve termine: redatto ogni anno</td></tr>
<tr><td>Chi lo redige</td><td>la scuola con la famiglia e il team multidisciplinare</td><td>il consiglio di classe, dopo aver consultato la famiglia</td></tr>
<tr><td>Contenuti</td><td>programmazione didattica ed educativa, obiettivi, materiali, metodo, criteri di valutazione</td><td>obiettivi formativi, strumenti compensativi e misure dispensative, strategie didattiche, forme di verifica e valutazione</td></tr>
<tr><td>Punti di forza</td><td>personalizzazione dettagliata, supporto multidisciplinare, obiettivi chiari, monitoraggio e aggiornamenti regolari</td><td>flessibilità, minore burocrazia, accessibilità anche a chi non ha una disabilità riconosciuta</td></tr>
</table>

<h3>2. Il contenuto minimo del PDP</h3>
<p>Le Linee guida indicano che la scuola predispone, in tempi <b>che non superino il primo trimestre scolastico</b>, un documento articolato per le discipline coinvolte dal disturbo, contenente almeno:</p>
<ol>
<li>dati anagrafici dell'alunno;</li>
<li>tipologia di disturbo;</li>
<li>attività didattiche individualizzate;</li>
<li>attività didattiche personalizzate;</li>
<li>strumenti compensativi utilizzati;</li>
<li>misure dispensative adottate;</li>
<li>forme di verifica e valutazione personalizzate.</li>
</ol>
<p>È fondamentale il raccordo con la famiglia, che può comunicare osservazioni su esperienze sviluppate anche autonomamente o in percorsi extrascolastici. Sulla base di questo documento vengono predisposte le modalità delle prove in corso d'anno e a fine ciclo.</p>

<h3>3. Struttura dei format ministeriali</h3>
<h4>Sezione 1 — Dati generali</h4>
<p>Nome, data di nascita, classe, insegnante referente o coordinatore; diagnosi medico-specialistica (data, autore, sede, eventuale aggiornamento); interventi pregressi o contemporanei al percorso scolastico (da chi, dove, periodo, frequenza, modalità); scolarizzazione pregressa; rapporti scuola-famiglia.</p>
<h4>Sezione 2 — Funzionamento delle abilità</h4>
<p>Per <b>lettura</b> (velocità, correttezza, comprensione), <b>scrittura</b> (grafia, tipologia di errori, produzione) e <b>calcolo</b> (mentale, per iscritto) si compilano <b>due colonne distinte</b>:</p>
<table>
<tr><th>Abilità</th><th>Elementi desunti dalla diagnosi</th><th>Elementi desunti dall'osservazione in classe</th></tr>
<tr><td>Lettura: velocità / correttezza / comprensione</td><td>…</td><td>…</td></tr>
<tr><td>Scrittura: grafia / tipologia errori / produzione</td><td>…</td><td>…</td></tr>
<tr><td>Calcolo: mentale / per iscritto</td><td>…</td><td>…</td></tr>
</table>
<p>Voce «Altro»: eventuali disturbi motorio-prassici, ulteriori disturbi associati, bilinguismo o italiano L2, livello di autonomia.</p>
<div class="box key"><b class="tag">Perché due colonne</b>La diagnosi dice come funziona lo studente in condizioni standardizzate; l'osservazione dice come funziona <b>nella vostra classe, con i vostri materiali</b>. Un PDP che copia solo la diagnosi non è un piano didattico: è un referto trascritto.</div>
<h4>Sezione 3 — Didattica personalizzata</h4>
<p>Per macroaree (linguistico-espressiva; logico-matematica-scientifica; storico-geografica-sociale; altre) si indicano: strategie e metodi di insegnamento; misure dispensative, strumenti compensativi e tempi aggiuntivi; nella secondaria anche <b>strategie e strumenti utilizzati dall'alunno nello studio</b>.</p>
<h4>Sezione 4 — Valutazione</h4>
<p>Tabella disciplina per disciplina: misure dispensative · strumenti compensativi · tempi aggiuntivi. Vale anche per gli esami conclusivi dei cicli.</p>

<h3>4. Strategie metodologiche da inserire nel PDP</h3>
<ul>
<li>valorizzare linguaggi comunicativi diversi dal codice scritto (iconografico, parlato), con mediatori didattici quali immagini, disegni, riepiloghi a voce;</li>
<li>utilizzare schemi e mappe concettuali;</li>
<li>insegnare l'uso di <b>dispositivi extratestuali</b> per lo studio: titolo, paragrafi, immagini;</li>
<li>promuovere inferenze, integrazioni e collegamenti fra conoscenze e discipline;</li>
<li>dividere gli obiettivi di un compito in <b>sotto-obiettivi</b>;</li>
<li>offrire anticipatamente schemi grafici sull'argomento, per orientare nella discriminazione delle informazioni essenziali;</li>
<li>privilegiare l'apprendimento dall'esperienza e la didattica laboratoriale;</li>
<li>promuovere processi metacognitivi per sollecitare autocontrollo e autovalutazione;</li>
<li>incentivare la didattica di piccolo gruppo e il tutoraggio fra pari;</li>
<li>promuovere l'apprendimento collaborativo.</li>
</ul>

<h3>5. Chi fa che cosa</h3>
<div class="grid2">
<div class="card"><h4>Dirigente scolastico</h4><p>È garante delle opportunità formative offerte. Attiva interventi preventivi, garantisce il raccordo con le realtà territoriali, promuove le iniziative condivise con organi collegiali e famiglie e può valutare l'opportunità di assegnare docenti curricolari con competenza nei DSA alle classi interessate.</p></div>
<div class="card"><h4>Uffici Scolastici Regionali</h4><p>Devono far sì che «l'attenzione e la cura educative non siano rimesse alla volontà dei singoli, ma riconducibili a una logica di sistema»: protocolli deontologici regionali, gruppi di coordinamento, accordi con associazioni e SSN, formazione, potenziamento dei <b>CTS</b>.</p></div>
<div class="card"><h4>Referente di istituto e docenti</h4><p>Il referente supporta i colleghi nella scelta e nell'uso degli strumenti; i docenti sostengono attivamente l'uso dei compensativi da parte degli alunni.</p></div>
<div class="card"><h4>Famiglia</h4><p>Comunica la diagnosi alla scuola, partecipa alla stesura del PDP, condivide osservazioni su percorsi extrascolastici, mantiene coerenza fra casa e scuola.</p></div>
</div>

<h3>6. Il PEI e il Progetto di vita</h3>
<p>Con il D.Lgs. 66/2017 e il D.Lgs. 96/2019 la certificazione cambia parametri: l'<b>Unità di Valutazione Multidisciplinare</b> redige un <b>Profilo di funzionamento</b> secondo l'ICF-CY dell'OMS. Questa classificazione non ha tabelle di "normalità": lascia alla professionalità degli operatori l'osservazione, la misurazione e la valutazione, e considera la persona in modo globale e multidimensionale, dove corpo, attività personali e partecipazione sociale sono interrelati.</p>
<p>Il <b>Progetto di vita</b>, la cui fase sperimentale è avviata da gennaio 2025, delinea i bisogni della persona non solo in termini di assistenza, ma per migliorare le condizioni di vita complessive e incoraggiare la partecipazione in ambito scolastico e lavorativo. Consente di proiettare il futuro dei ragazzi già durante il percorso scolastico: il ruolo di lavoratore, di persona che vive da sola, che ha relazioni affettive, che partecipa a diritti e doveri di cittadinanza.</p>
<p class="small">Va tenuto distinto dal <b>Progetto individuale</b> redatto dal Comune di residenza (L. 328/2000), pur avendo con esso punti di contatto sul lungo periodo e sui progetti del "dopo di noi".</p>
