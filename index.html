id:"valutazione", parte:"Documenti", titolo:"Verifiche e valutazione inclusiva", durata:"30 min",
html:`
<p class="lead">La domanda che precede ogni prova è una sola: <b>che cosa sto valutando davvero?</b> Se l'obiettivo è "comprendere il testo", la velocità di lettura non è l'oggetto della valutazione ed è scorretto che ne determini l'esito.</p>

<h3>1. La cornice normativa</h3>
<div class="box norm"><b class="tag">D.M. 5669/2011, art. 6</b>Le istituzioni scolastiche adottano modalità valutative che consentono allo studente con DSA di dimostrare <b>effettivamente il livello di apprendimento raggiunto</b>, applicando misure che determinino le condizioni ottimali per l'espletamento della prestazione — quanto a tempi e a strutturazione delle prove — riservando particolare attenzione alla padronanza dei contenuti disciplinari, <b>a prescindere dagli aspetti legati all'abilità deficitaria</b>.</div>
<ul>
<li><b>DPR 122/2009 art. 10</b> — la valutazione e la verifica, comprese quelle in sede di esame conclusivo dei cicli, devono tenere conto delle situazioni soggettive; nel diploma non si fa menzione delle modalità di svolgimento e della differenziazione delle prove.</li>
<li><b>D.Lgs. 62/2017 art. 11 c. 9-10</b> — la valutazione, l'ammissione e la partecipazione all'esame del primo ciclo sono <b>coerenti con il PDP</b>; si adottano modalità che consentano di dimostrare il livello di apprendimento conseguito.</li>
<li><b>D.Lgs. 62/2017 art. 20 c. 11</b> — nelle prove scritte i candidati con DSA possono usare tempi più lunghi e gli strumenti compensativi previsti dal PDP <b>e già impiegati nelle verifiche in corso d'anno</b>, senza che ne sia pregiudicata la validità. Nel diploma non si fa menzione degli strumenti compensativi.</li>
</ul>
<div class="box alert"><b class="tag">Il vincolo pratico</b>Uno strumento mai usato durante l'anno non può comparire all'esame. La coerenza fra documento e prassi quotidiana non è formalismo: è la condizione perché lo strumento sia utilizzabile quando conta.</div>

<h3>2. Preparare il compito in classe</h3>
<ul>
<li>testo del compito <b>chiaro ed essenziale</b>;</li>
<li>più tempo;</li>
<li>dare indicazioni sullo svolgimento, anche durante la prova;</li>
<li>aiutarlo a iniziare;</li>
<li>consentire l'uso di griglie con indicazioni procedurali;</li>
<li>se possibile, predisporre lo spazio per la risposta <b>dopo ogni domanda</b>;</li>
<li>evitare compiti con troppi esercizi: eventualmente dare una parte alla volta;</li>
<li>suddividere i compiti complessi nelle loro parti componenti, così che l'alunno possa completare con successo più parti possibili;</li>
<li>dare consegne a cui realisticamente l'alunno potrà far fronte;</li>
<li>evitare troppe domande a risposta aperta;</li>
<li>nelle materie di studio preferire, se possibile, l'interrogazione orale;</li>
<li>monitorare i possibili distrattori presenti nell'ambiente;</li>
<li>valutazione adeguata e <b>non rapportata ai compagni</b>.</li>
</ul>
<div class="box"><b class="tag">Sul registratore</b>Va consentito l'uso degli strumenti compensativi programmati, <b>compreso, quando serve, il registratore vocale. E non esistono problemi di privacy.</b> E non si penalizza nella valutazione chi ha usato strumenti compensativi o misure dispensative.</div>

<h3>3. Micro-regole per scrivere le consegne</h3>
<ul>
<li><b>una consegna per riga</b>; evitare frasi lunghe;</li>
<li>evidenziare i <b>verbi operativi</b> (sottolineatura o grassetto);</li>
<li>ridurre il carico sulla memoria di lavoro: esempi già pronti e passaggi espliciti;</li>
<li>se possibile: meno esercizi, ma rappresentativi degli obiettivi;</li>
<li>curare layout e segmentazione: spaziatura, blocchi, meno passaggi mentali impliciti.</li>
</ul>

<h3>4. Gli orali</h3>
<ul>
<li><b>programmare</b> le interrogazioni;</li>
<li>favorire calma, silenzio, ascolto, anche quando è lento;</li>
<li>lasciare il tempo per la rielaborazione mentale;</li>
<li>lasciare esprimere senza interruzione;</li>
<li>con pazienza, dimostrare disponibilità a ripetere informazioni e domande;</li>
<li>utilizzare <b>domande facilitanti</b>;</li>
<li>incoraggiare la comunicazione, anche visiva;</li>
<li>aiutare a superare ansia, disattenzione, distrazione;</li>
<li><b>fornire i criteri valutativi</b> in anticipo;</li>
<li>evitare osservazioni negative se sforzi e impegno sono evidenti;</li>
<li>evidenziare i progressi più che le carenze;</li>
<li>tenere conto delle capacità lessicali ed espressive proprie dello studente.</li>
</ul>
<p class="small">Struttura utile per l'orale strutturato: percorsi A/B/C predefiniti e domande guida condivise. Riduce l'ansia e alza la qualità della prestazione.</p>

<h3>5. Cinque criteri per una valutazione corretta</h3>
<ol>
<li>definire chiaramente <b>che cosa</b> si sta valutando;</li>
<li><b>separare</b> i contenuti della valutazione dalle capacità strumentali;</li>
<li>attenzione alla competenza più che alla forma, ai processi più che al solo prodotto;</li>
<li>valutare l'<b>apprendimento</b>, cioè quello che lo studente ha effettivamente imparato (non solo ciò che sa);</li>
<li>consentire lo svolgimento anche con l'uso di strumenti e tecnologie.</li>
</ol>
<p>E in caso di insuccesso nello scritto: riflettere sull'errore e individuarne le cause (difficoltà visuo-spaziali? erronea applicazione di procedure? mancanza di studio? affaticamento?), cercando di verificare le conoscenze con un colloquio orale.</p>

<h3>6. Gli errori non si contano, si interpretano</h3>
<div class="box key"><b class="tag">Regola operativa</b>Per aiutare un alunno in difficoltà occorre imparare a capirne gli errori: questi non vanno contati, ma <b>interpretati</b>.
<ul style="margin-top:.5rem">
<li>non calcolare gli errori di calcolo;</li>
<li>non calcolare gli errori di trascrizione;</li>
<li>non correggere e non calcolare gli errori ortografici;</li>
<li>non calcolare il tempo impiegato;</li>
<li>tener conto del punto di partenza e dei risultati conseguiti;</li>
<li>premiare i progressi e gli sforzi;</li>
<li>comprendere, ma soprattutto <b>far comprendere</b> l'errore.</li>
</ul></div>
<p>Tre domande per una valutazione consapevole: perché lo studente ha operato queste scelte procedurali per rispondere alla consegna? Quale processo di pensiero lo ha guidato? Quale voto dà ragione all'impegno profuso? Una valutazione che tenesse conto del solo punteggio complessivo non collocherebbe correttamente i profili DSA.</p>

<h3>7. La valutazione non passa solo per la prova scritta</h3>
<ul>
<li>il <b>lavoro di gruppo</b> è un ottimo strumento per verificare l'appreso e l'abilità esecutiva: l'insegnante deve solo osservare;</li>
<li>fornire allo studente, alcuni giorni prima, un <b>fac-simile</b> della prova da svolgere in autonomia: abbassa sensibilmente l'ansia;</li>
<li>i test online assegnati a casa possono essere occasione di valutazione;</li>
<li>ogni momento di lavoro è un'occasione per verificare come e quanto lo studente stia lavorando.</li>
</ul>
<h4>Altre indicazioni per le prove</h4>
<ul>
<li>predisporre verifiche <b>scalari</b> e programmarle concordandole con l'alunno;</li>
<li>prevedere verifiche orali a compensazione di quelle scritte, soprattutto per la lingua straniera;</li>
<li>far usare strumenti e mediatori didattici nelle prove sia scritte sia orali (mappe concettuali e cognitive);</li>
<li>introdurre prove informatizzate, anche con supporti visivi e particolarità grafiche facilitanti;</li>
<li>programmare tempi più lunghi; pianificare prove di valutazione formativa;</li>
<li>valutare tenendo conto maggiormente del contenuto più che della forma, e delle competenze di analisi, sintesi e collegamento più che della correttezza formale.</li>
</ul>

<h3>8. Rubriche: rendere trasparenti i criteri</h3>
<p>Una rubrica a quattro livelli, con descrittori espliciti, evita che l'adattamento sia percepito come arbitrio. Criteri di base adattabili a ogni materia:</p>
<table>
<tr><th>Criterio</th><th>Livello 1</th><th>Livello 2</th><th>Livello 3</th><th>Livello 4</th></tr>
<tr><td>Comprensione della consegna</td><td>descrittore</td><td>descrittore</td><td>descrittore</td><td>descrittore</td></tr>
<tr><td>Procedura / metodo</td><td>descrittore</td><td>descrittore</td><td>descrittore</td><td>descrittore</td></tr>
<tr><td>Accuratezza</td><td>descrittore</td><td>descrittore</td><td>descrittore</td><td>descrittore</td></tr>
<tr><td>Completezza</td><td>descrittore</td><td>descrittore</td><td>descrittore</td><td>descrittore</td></tr>
</table>
<div class="box"><b class="tag">Nota per PDP e PEI</b>Nella rubrica si indicano eventuali strumenti e misure che influenzano <b>la modalità della prova, non l'obiettivo valutato</b>. È la formulazione che tiene insieme inclusione e rigore.</div>

<h3>9. Struttura di una verifica adattata</h3>
<p>Intestazione: materia, classe, data, durata standard, <b>durata adattata</b>, strumenti consentiti, misure applicabili, formato (font, spaziatura). Poi, per ogni attività:</p>
<ul>
<li><b>Obiettivo</b> — che cosa sto valutando;</li>
<li><b>Consegna</b> breve;</li>
<li><b>Esempio guidato</b>, se utile;</li>
<li>spazio risposta adeguato.</li>
</ul>
<p>In coda, un'autovalutazione facoltativa dello studente: ho capito tutte le consegne? quale parte è risultata più difficile? quale strumento mi ha aiutato di più?</p>
<blockquote>«Non c'è nulla che sia più ingiusto quanto far parti uguali fra disuguali.» — <i>Lettera a una professoressa</i>, 1967</blockquote>

id:"emozioni", parte:"Relazione", titolo:"Emozioni, autostima, motivazione", durata:"30 min",
html:`
<p class="lead">L'apprendimento non è mai solo un fatto cognitivo. Senza un ambiente che faccia sentire compresi, sicuri e motivati, ogni strategia didattica perde forza.</p>

<h3>1. Il circolo vizioso da interrompere</h3>
<table>
<tr><th>Fenomeno</th><th>Come si manifesta</th></tr>
<tr><td><b>Frustrazione scolastica</b></td><td>difficoltà ricorrenti che fanno sentire incapaci o meno competenti dei coetanei; riduce motivazione e impegno, alimentando un circolo di insuccessi</td></tr>
<tr><td><b>Ansia da prestazione</b></td><td>paura di non soddisfare le aspettative proprie, degli insegnanti e dei genitori; peggiora la concentrazione, quindi i risultati, quindi il senso di inadeguatezza</td></tr>
<tr><td><b>Caduta di autostima e autoefficacia</b></td><td>lo studente inizia a percepirsi incapace e perde la convinzione di poter raggiungere obiettivi e superare difficoltà</td></tr>
<tr><td><b>Impatto sul comportamento sociale</b></td><td>chiusura ed evitamento delle interazioni per paura del giudizio; in altri casi comportamenti oppositivi o aggressivi come risposta al senso di impotenza</td></tr>
</table>
<div class="box alert"><b class="tag">Il rischio strutturale</b>Le Linee guida sono esplicite: la specificità cognitiva degli studenti con DSA determina «importanti fattori di rischio per quanto concerne la <b>dispersione scolastica</b>, dovuta in questi casi a ripetute esperienze negative e frustranti durante l'intero iter formativo».</div>

<h3>2. Il successo è la terapia</h3>
<p>«Il successo nell'apprendimento è l'immediato intervento da opporre alla tendenza a una scarsa percezione di autoefficacia e di autostima. Ogni reale apprendimento acquisito e ogni successo scolastico rinforzano la percezione di poter riuscire nonostante le difficoltà.»</p>
<p>Il contrario è altrettanto vero: <b>non</b> realizzare le attività personalizzate, <b>non</b> utilizzare gli strumenti compensativi, <b>disapplicare</b> le misure dispensative colloca lo studente in uno stato di immediata inferiorità rispetto alle prestazioni richieste — «e non per assenza di buona volontà, ma per una problematica che lo trascende oggettivamente».</p>
<p>Dispensare da alcune prestazioni — come la lettura ad alta voce in classe — oltre a non avere rilevanza sull'apprendimento, <b>evita la frustrazione collegata alla dimostrazione pubblica della propria difficoltà</b>.</p>

<h3>3. Il problema degli strumenti visti dai compagni</h3>
<div class="box"><b class="tag">Linee guida §5</b>Ai compagni di classe gli strumenti compensativi e le misure dispensative «possono risultare incomprensibili facilitazioni». Il coordinatore di classe, sentita la famiglia interessata, può avviare iniziative per <b>condividere con i compagni le ragioni</b> dell'applicazione degli strumenti, anche per evitare la stigmatizzazione e le ricadute psicologiche negative.</div>
<p>Alternativa pratica già sperimentata: somministrare a <b>tutta la classe</b> lo stesso formato accessibile (font ad alta leggibilità, spaziatura, consegne segmentate). Nessuno riceve un foglio diverso e la leggibilità migliora per tutti.</p>

<h3>4. Tre concetti da non confondere</h3>
<div class="grid2">
<div class="card"><h4>Autostima</h4><p>Combinazione di pensieri e sentimenti che si esprime nel valore che la persona attribuisce a sé (Kunda). Risultato del confronto fra i successi realmente ottenuti e le <b>aspettative</b> rispetto a quei successi (James). Prodotto delle interazioni con gli altri (Cooley e Mead). È un giudizio di valore globale.</p></div>
<div class="card"><h4>Autoefficacia</h4><p>Percezione della propria competenza <b>in un ambito specifico</b>; influenza motivazione e scelta dei comportamenti (Bandura). Non è un giudizio globale: è contesto e compito specifica. Si costruisce da successi e fallimenti sperimentati, esperienze vicarie, capacità di immaginare le conseguenze delle proprie azioni. Un'alta autoefficacia produce maggiore persistenza nei compiti difficili in cui i successi tardano ad arrivare.</p></div>
<div class="card"><h4>Motivazione</h4><p>Insieme di fattori dinamici che provocano e mantengono azioni dirette a un fine. <b>Estrinseca</b>: premio, riconoscimento, complimento. <b>Intrinseca</b>: bisogno di sentirsi competente, interesse, curiosità, autodeterminazione.</p></div>
<div class="card"><h4>La sequenza</h4><p>È preferibile che la motivazione allo studio sia intrinseca, ma all'inizio si può incentivare quella estrinseca attraverso i rinforzi, per poi stimolare quella intrinseca con l'interesse, la curiosità o un obiettivo cognitivo più impegnativo <b>ma raggiungibile</b>.</p></div>
</div>
<p class="small">Autoefficacia scolastica: riguarda la convinzione di saper regolare il proprio apprendimento e affrontare i compiti. Influenza impegno, persistenza, scelta delle attività; un livello elevato porta ad aspirazioni più alte, maggiore flessibilità nella risoluzione dei problemi e maggiore accuratezza nell'autovalutazione.</p>

<h3>5. Che cosa fa il tutor sul piano emotivo</h3>
<ul>
<li><b>Ascolto attivo ed empatia</b> — captare segnali che passano inosservati, come frustrazione o ansia, e intervenire in modo mirato.</li>
<li><b>Clima emotivo positivo</b> — ambiente sereno e stimolante in cui l'alunno si senta accettato e sicuro; nessun giudizio, ogni passo avanti è un successo anche se piccolo.</li>
<li><b>Motivazione personalizzata</b> — rinforzi positivi, obiettivi realistici e raggiungibili, celebrazione dei successi, autonomia incentivata.</li>
<li><b>Supporto nel fallimento percepito</b> — aiutare a vedere gli errori come opportunità di crescita e a capire che <b>il fallimento non definisce il proprio valore</b>.</li>
</ul>

<h3>6. Attività concrete</h3>
<h4>Diario dei successi</h4>
<p>Ogni giorno lo studente scrive <b>tre cose che ha fatto bene</b>, scolastiche ("ho letto 5 pagine senza fermarmi") ed extrascolastiche ("ho aiutato un amico con i compiti"). Ogni settimana il tutor condivide i successi, sottolineando anche i piccoli traguardi. <i>Risultato atteso</i>: consapevolezza dei progressi e comprensione che la crescita è un processo graduale.</p>
<h4>Feedback costruttivo invece della correzione secca</h4>
<p>Esempio con un sedicenne con discalculia: quando sbaglia, invece di criticare — «Hai fatto un ottimo tentativo. La prossima volta prova a seguire questi passaggi in ordine: 1) riscrivi il problema, 2) usa la calcolatrice per verificare i numeri, 3) controlla il risultato». Si indica l'errore <b>e</b> si offre una procedura.</p>
<h4>Role playing sulla frustrazione</h4>
<p>Con un quindicenne con disortografia: recitare una scena in cui il personaggio sbaglia una prova scritta e deve gestire la frustrazione trovando soluzioni per calmarsi — fare una pausa, chiedere aiuto. Poi discussione settimanale sulle emozioni provate e sulle strategie per gestirle.</p>
<h4>Diario delle emozioni e mappe emotive</h4>
<p>Registro dei momenti di frustrazione o ansia, insieme alle strategie usate per gestirli, rivisto ogni settimana con il tutor. Le <b>mappe emotive</b> sono le strutture con cui costruiamo la nostra identità emotiva; l'alfabetizzazione emotiva va curata parallelamente a quella didattica. Un valido aiuto viene dalla lettura delle fiabe, che insegnano a riconoscere emozioni e sentimenti.</p>
<h4>Cooperative learning e circle time</h4>
<ul>
<li>inizio settimana: cerchio delle emozioni, ogni alunno esprime come si sente con una parola o un'immagine;</li>
<li>fine attività: riflessione su come ci siamo sentiti lavorando insieme;</li>
<li>gruppi misti (DSA e non) per stimolare inclusione e valorizzazione delle differenze;</li>
<li>brainstorming emotivo su situazioni scolastiche; giochi cooperativi per il senso di appartenenza.</li>
</ul>
<h4>App per il benessere emotivo</h4>
<p><span class="pill">Mindful Powers</span><span class="pill">Smiling Mind</span><span class="pill">Breathe, Think, Do with Sesame</span><span class="pill">Mood Meter</span><br>
Uso in classe: 5–10 minuti guidati a inizio giornata per monitorare l'umore; laboratorio settimanale di mindfulness e riflessione guidata; percorsi individuali per studenti con difficoltà di autoregolazione emotiva.</p>

<h3>7. La ricerca</h3>
<p>Le neuroscienze affettive mostrano che quando gli studenti sono emotivamente coinvolti e motivati l'apprendimento avviene in modo più efficace. Il sistema limbico gioca un ruolo centrale: se le emozioni sono gestite positivamente, il cervello attiva aree che favoriscono memorizzazione e risoluzione dei problemi. Memoria, motivazione e attenzione sono tutte influenzate dallo stato emotivo.</p>

<h3>8. Cinque proposte operative per il tutor</h3>
<ol>
<li>integrare attività di educazione emotiva nel piano di supporto individualizzato;</li>
<li>usare strumenti digitali e analogici per aiutare a riconoscere e nominare le proprie emozioni;</li>
<li>promuovere dialogo costante con famiglia e team docenti per condividere osservazioni e strategie;</li>
<li>rinforzare ogni piccolo successo con feedback costruttivo;</li>
<li>diventare un punto di riferimento stabile, capace di ascolto empatico e di sostegno nei momenti difficili.</li>
</ol>
<blockquote>«L'intelligenza emotiva è il ponte tra ciò che sappiamo e ciò che sappiamo fare con quello che proviamo.» — Daniel Goleman</blockquote>
<p>L'intelligenza emotiva degli adulti di riferimento fa una grande differenza: non solo rende il percorso scolastico più sereno, ma incide sulla vita adulta, perché quei ragazzi <b>non vivranno la loro dislessia: saranno in grado di vivere la loro vita</b>.</p>

id:"tutor", parte:"Relazione", titolo:"Il ruolo del Tutor DSA: accoglienza, consapevolezza, intervento", durata:"25 min",
html:`
<p class="lead">Il Tutor DSA viene spesso scambiato per un maestro o per un aiutocompiti. Il suo lavoro è diverso: permette a ragazze e ragazzi con DSA di lavorare in modo <b>organizzato e autonomo</b> nello studio. L'obiettivo finale è non essergli più necessario.</p>

<h3>1. Che cosa fa</h3>
<ul>
<li>trasmette modalità strategiche di organizzazione;</li>
<li>insegna e guida a utilizzare gli strumenti compensativi;</li>
<li>verifica quali siano le misure dispensative più adatte;</li>
<li>fa da <b>ponte</b> fra la famiglia, la scuola e lo studente;</li>
<li>promuove l'autonomia.</li>
</ul>
<p>Tutto ciò poggia su una conoscenza approfondita delle norme vigenti, in particolare della Legge 170/2010.</p>

<h3>2. Fase 1 — Accoglienza</h3>
<p>Ragazzi e genitori possono sentirsi confusi e spaventati dalla presenza di una diagnosi. Il primo compito del tutor è di <b>guida</b>: rispondere in modo esaustivo alle domande e ai dubbi frequenti. Non è raro che serva correggere errori derivanti da incomprensioni o pregiudizi.</p>
<div class="box"><b class="tag">Domande che arrivano quasi sempre</b>«È una malattia?» — no, è una caratteristica del funzionamento. «Passerà?» — non passa, ma si compensa. «Mio figlio è meno intelligente?» — no, per definizione le capacità cognitive sono adeguate. «Gli strumenti lo aiutano troppo?» — sollevano da una prestazione resa difficoltosa dal disturbo, senza facilitare il compito cognitivo.</div>

<h3>3. Fase 2 — Consapevolezza</h3>
<p>Chiarita la diagnosi, si passa alla domanda che apre il lavoro personalizzato: <b>«come funziono?»</b>. Con una serie di domande e di indagini si analizzano i punti di debolezza evidenziati dalla diagnosi o dal soggetto stesso, ma soprattutto i <b>punti di forza</b>, che diventeranno lo strumento per colmare le difficoltà.</p>
<p>La diagnosi va letta attentamente: spesso specifica già quali strumenti compensativi e dispensativi sono adeguati per l'apprendimento e per verifiche e interrogazioni, e contiene suggerimenti per sostenere motivazione e autostima e per la famiglia (per esempio, attivare un supporto esterno per acquisire un metodo di studio autonomo).</p>

<h3>4. Fase 3 — Intervento</h3>
<p>Tre aree legate fra loro, che ruotano intorno alla persona: nessuna può esistere senza le altre.</p>
<h4>3.1 Organizzazione</h4>
<p>Molti studenti hanno problemi nelle basi dell'organizzazione. Il tutor studia le modalità del soggetto, fornisce feedback e consigli sulle procedure poco funzionali e lo guida verso un'organizzazione più adatta a lui: del materiale scolastico, della materia da cui cominciare, del proprio tempo e dei propri impegni.</p>
<p>Concretamente:</p>
<ul>
<li>calendario settimanale delle materie scolastiche;</li>
<li>controllare sul diario i compiti di <b>tutta la settimana</b>;</li>
<li>compilare una tabella con la suddivisione dei compiti e del tempo;</li>
<li>avere e preparare tutto il materiale necessario;</li>
<li>scegliere un ambiente adeguato;</li>
<li>avere qualcuno a cui chiedere aiuto in caso di necessità — <b>anche un compagno, non necessariamente un adulto</b>.</li>
</ul>
<h4>3.2 Strumenti compensativi e misure dispensative</h4>
<p>La scelta non è banale: come non esiste una medicina che cura tutte le malattie, ogni ragazzo funziona in modo diverso. Il tutor guida nella scoperta e comprensione degli strumenti e si assicura della corretta gestione e fruizione in ambito scolastico e familiare, facendo riferimento al diritto sancito dalla 170 e alle modalità espresse nel PDP.</p>
<h4>3.3 Sostegno e autonomia</h4>
<p>Lavorare sull'autostima, guidando il ragazzo ad aumentare la fiducia in sé, nelle proprie capacità, nei propri punti di forza e negli strumenti a sua disposizione, <b>al fine ultimo di non aver più bisogno di noi</b>.</p>

<h3>5. Il metodo di studio</h3>
<p>Il metodo di studio di uno studente, soprattutto con DSA, deve:</p>
<ul>
<li>essere <b>personalizzato</b>;</li>
<li>sfruttare il canale preferenziale di apprendimento, <b>sviluppando però anche gli altri</b>;</li>
<li>essere flessibile;</li>
<li>sfruttare tutte le risorse didattiche disponibili;</li>
<li><b>essere esso stesso appreso</b>: non si dà per scontato, si insegna. È qui che interviene il tutor.</li>
</ul>

<h3>6. Lo schema dell'autonomia</h3>
<div class="box key"><b class="tag">Il modello da tenere a mente</b>
L'<b>autonomia</b> non nasce dagli strumenti compensativi da soli. Richiede l'interazione di cinque componenti:
<ul style="margin-top:.5rem">
<li>strumenti compensativi</li>
<li>metodo e organizzazione</li>
<li>autoefficacia e autostima</li>
<li>motivazione intrinseca</li>
<li><b>relazione</b> con i compagni, i docenti e il tutor</li>
</ul>
Il tutor non lavora solo sugli strumenti compensativi: l'obiettivo principale è l'autonomia dello studente, che richiede competenze cognitive, motivazionali, emotive e relazionali.</div>

<h3>7. La relazione con la famiglia</h3>
<ul>
<li>condividere osservazioni e progressi <b>regolarmente</b>, non solo nelle situazioni di difficoltà;</li>
<li>concordare obiettivi chiari e realistici, uguali a casa e a scuola;</li>
<li>rispettare il PDP e le indicazioni degli specialisti;</li>
<li>mantenere un clima di fiducia reciproca, con al centro il benessere del ragazzo;</li>
<li>ricordare che il percorso è graduale: piccoli passi costanti portano a grandi cambiamenti nel tempo.</li>
</ul>
<div class="box"><b class="tag">Da tenere sempre presente</b>Mostrare per primi l'errore come opportunità di successo e cambiamento, non come motivo di vergogna.</div>

id:"adhd", parte:"Altri BES", titolo:"ADHD: comprensione e strategie didattiche", durata:"30 min",
html:`
<p class="lead">L'ADHD è un disturbo neuropsichiatrico del neurosviluppo che si manifesta con una combinazione di difficoltà di attenzione, impulsività e iperattività, con ricadute su apprendimento, comportamento e relazioni sociali.</p>

<h3>1. I tre gruppi di sintomi</h3>
<div class="grid2">
<div class="card"><h4>Inattenzione</h4><ul>
<li>difficoltà a concentrarsi su compiti o giochi</li>
<li>facile distrazione da stimoli esterni</li>
<li>difficoltà a seguire le istruzioni o a completare i compiti</li>
<li>obiettivi incompleti a causa della disattenzione</li>
</ul></div>
<div class="card"><h4>Iperattività</h4><ul>
<li>eccessiva agitazione fisica, difficoltà a rimanere seduto</li>
<li>movimento continuo (agitare mani o piedi)</li>
<li>parla troppo o continuamente senza pause</li>
</ul></div>
<div class="card"><h4>Impulsività</h4><ul>
<li>difficoltà ad attendere il proprio turno</li>
<li>risponde troppo rapidamente a domande o situazioni</li>
<li>interrompe o si intromette nelle conversazioni</li>
</ul></div>
</div>

<h3>2. Dislessia e ADHD a confronto</h3>
<table>
<tr><th>Dislessia</th><th>ADHD</th></tr>
<tr><td>difficoltà con la lettura</td><td>difficoltà a sostenere la concentrazione</td></tr>
<tr><td>difficoltà di consapevolezza fonemica</td><td>impulsività e iperattività</td></tr>
<tr><td><b>intervallo di attenzione normale</b></td><td><b>influisce su più attività</b>, non su un'abilità sola</td></tr>
<tr><td>riguarda l'elaborazione del linguaggio</td><td>riguarda ampiamente le funzioni esecutive</td></tr>
<tr><td>la lettura migliora con il supporto</td><td>la routine strutturata aiuta</td></tr>
</table>
<p class="small">La distinzione è operativa: nella dislessia si compensa un'abilità specifica; nell'ADHD si struttura l'ambiente, il tempo e la sequenza del compito.</p>

<h3>3. Cause e diagnosi</h3>
<p>Le cause precise non sono completamente chiare: si ipotizza una combinazione di fattori <b>genetici</b> (la predisposizione è un fattore importante), <b>neurologici</b> (alterazioni in aree cerebrali come il lobo frontale, che controllano funzioni cognitive e comportamentali) e <b>ambientali</b> (esposizione a sostanze tossiche in gravidanza, situazioni traumatiche nei primi anni di vita).</p>
<p>La diagnosi richiede una valutazione completa: osservazioni cliniche; interviste con genitori, insegnanti e altre figure di riferimento; questionari e scale di valutazione (Conners Rating Scale, Vanderbilt ADHD Diagnostic Rating Scale); valutazioni cognitive e psicologiche.</p>
<p>Il trattamento è multidisciplinare: farmacoterapia (stimolanti come il metilfenidato, non stimolanti come l'atomoxetina), psicoeducazione di genitori e insegnanti, psicoterapia comportamentale per l'autoregolazione, supporto scolastico.</p>
<p class="small">L'ADHD può persistere in età adulta, manifestandosi come difficoltà nella gestione del tempo, nell'organizzazione, nella pianificazione e nel rispetto delle scadenze; l'approccio include terapia cognitivo-comportamentale, coaching e farmacoterapia.</p>

<h3>4. Strutturare l'ambiente</h3>
<ul>
<li>ambiente tranquillo e ordinato, privo di distrazioni visive e sonore;</li>
<li>posizionare lo studente <b>vicino alla cattedra, lontano da finestre e porte</b>;</li>
<li>fornire uno <b>spazio definito per ogni attività</b>.</li>
</ul>

<h3>5. Metodi di insegnamento</h3>
<ul>
<li><b>Suddivisione dei compiti</b> — invece di attività lunghe e complesse, fasi più piccole e gestibili, con obiettivi chiari per ciascuna parte.</li>
<li><b>Tecniche visive e multimediali</b> — immagini, grafici, mappe concettuali, video.</li>
<li><b>Strumenti compensativi</b> — calcolatrici, audiolibri, software educativi.</li>
<li><b>Apprendimento esperienziale</b> — attività pratiche, laboratoriali, di movimento.</li>
<li><b>Didattica cooperativa</b> — gruppi di lavoro con <b>ruoli specifici</b>.</li>
<li><b>Lezioni brevi e interattive</b> — alternare spiegazioni brevi a discussione o attività dinamiche.</li>
</ul>

<h3>6. Gestione del tempo</h3>
<ul>
<li>routine chiara e prevedibile, in modo che lo studente possa <b>anticipare</b> ciò che accadrà;</li>
<li>orologio visibile o timer che indichi il tempo rimanente per ogni attività;</li>
<li><b>pause regolari</b>: circa 5 minuti ogni 20–30 minuti di lavoro;</li>
<li>le <b>pause attive</b>, con brevi esercizi fisici, sono particolarmente utili.</li>
</ul>

<h3>7. Rinforzo e motivazione</h3>
<ul>
<li><b>rinforzi positivi immediati</b>: lodi, piccoli premi, privilegi;</li>
<li><b>contratti comportamentali</b>: regole e obiettivi chiari, concordando con lo studente premi e conseguenze, per aumentare senso di responsabilità e controllo;</li>
<li><b>obiettivi a breve termine</b> e realistici, per far sentire competente e ridurre l'ansia.</li>
</ul>

<h3>8. Verifiche</h3>
<ul>
<li>verifiche strutturate e guidate: risposta multipla, completamento, esercizi strutturati;</li>
<li>tempi aggiuntivi;</li>
<li>valutazione flessibile, che consideri impegno ed evoluzione nel tempo, non solo il risultato finale;</li>
<li>osservazione costante e modifica del piano educativo quando serve; supporto individuale o in piccoli gruppi.</li>
</ul>

<h3>9. Nove attività pratiche</h3>
<div class="grid2">
<div class="card"><h4>Apprendimento dinamico</h4>
<p><b>Caccia al tesoro didattica</b>: indizi legati alla lezione (matematica: trovare oggetti con una certa forma geometrica; storia: indizi su un personaggio). Si risolvono problemi o indovinelli per ottenere l'indizio successivo.<br>
<b>Tabelline con il salto</b>: cerchi numerati a terra, si salta sul risultato corretto della tabellina chiamata.</p></div>
<div class="card"><h4>Materiali interattivi</h4>
<p><b>Puzzle tematici</b>: ricostruire una mappa geografica o la sequenza di un processo scientifico.<br>
<b>Laboratori pratici</b>: esperimenti semplici come il vulcano con bicarbonato e aceto o un circuito elettrico di base.</p></div>
<div class="card"><h4>Giochi di gruppo</h4>
<p><b>Memory gigante</b>: schede colorate a terra con parole e definizioni, oppure domande e risposte.<br>
<b>Giro della domanda</b>: ogni studente riceve una carta con una domanda; passandosi una palla si risponde a turno.</p></div>
<div class="card"><h4>Routine visive</h4>
<p><b>Ruota delle attività</b>: una ruota con lettura, pausa, disegno, esercizio. Gli studenti la girano e completano l'attività corrispondente.</p></div>
<div class="card"><h4>Multisensoriale</h4>
<p><b>Scrivere con la sabbia</b>: vassoio con sabbia o farina per lettere, numeri, parole chiave.<br>
<b>Imparare con la musica</b>: canzoni o ritmi per memorizzare (tabelline, regioni italiane).</p></div>
<div class="card"><h4>Brevi attività fisiche</h4>
<p><b>Gioco delle pose</b>: mostrare immagini di animali o personaggi e imitarne la posizione mentre si discute l'argomento.<br>
<b>Alzati e rispondi</b>: alzarsi solo se si conosce la risposta.</p></div>
<div class="card"><h4>Disegno e creatività</h4>
<p><b>Crea la tua storia</b>: dopo la lezione, disegnare una vignetta o una sequenza di immagini che racconti l'argomento.<br>
<b>Costruzioni tematiche</b>: LEGO o plastilina per rappresentare una cellula, un edificio storico, una scena di un libro.</p></div>
<div class="card"><h4>Sfide brevi</h4>
<p><b>Sfida dei 5 minuti</b>: un compito breve da completare entro il tempo stabilito (5 operazioni, 3 parole difficili nel testo).<br>
<b>Trova l'errore</b>: un testo o un'immagine con errori da individuare.</p></div>
</div>

<h3>10. Il contatto con la natura</h3>
<p>La cosiddetta <i>green therapy</i> offre benefici documentati e complementari agli interventi tradizionali:</p>
<ul>
<li><b>attenzione</b> — il tempo trascorso in ambienti naturali riduce i sintomi di disattenzione e migliora la concentrazione; la "teoria del restauro dell'attenzione" suggerisce che gli ambienti naturali aiutino a ripristinare la capacità di focalizzarsi, riducendo la sovrastimolazione tipica degli ambienti chiusi o caotici;</li>
<li><b>iperattività e impulsività</b> — correre, esplorare, giocare in spazi verdi permette di scaricare energia in modo naturale e regolato;</li>
<li><b>regolazione emotiva</b> — abbassa lo stress e promuove uno stato di calma, utile per chi fatica con l'autoregolazione;</li>
<li><b>relazioni sociali</b> — gli spazi aperti favoriscono collaborazione e gioco di gruppo.</li>
</ul>

<h3>11. Strumenti digitali e di organizzazione</h3>
<p>App didattiche, giochi educativi e piattaforme online aiutano a mantenere interesse e motivazione e a gestire meglio tempo e attività. Agende digitali o cartacee, elenchi di cose da fare, calendari visivi sostengono l'organizzazione e la pianificazione.</p>

<h3>12. Benefici della didattica individualizzata</h3>
<ul>
<li>maggiore attenzione e partecipazione;</li>
<li>riduzione di ansia e frustrazione derivanti dall'incapacità di completare i compiti;</li>
<li>sviluppo delle competenze di autogestione e autoregolazione;</li>
<li>incremento di autostima e motivazione scolastica.</li>
</ul>

id:"autismo", parte:"Altri BES", titolo:"Disturbo dello spettro autistico a scuola", durata:"35 min",
html:`
<p class="lead">L'autismo è una <b>neurodivergenza</b>: un modo diverso in cui funziona il cervello. La diagnosi non si basa su esami strumentali ma sull'osservazione del comportamento, e ogni profilo va conosciuto prima di essere programmato.</p>

<div class="box"><b class="tag">Takiwātanga</b>Nel 2017 il linguista māori Keri Opai ha coniato questo termine per indicare l'autismo: significa «<b>nel suo tempo e spazio</b>». Enfatizza la connessione unica che le persone autistiche hanno con il loro ambiente, celebrando le differenze invece di limitarsi a riconoscerne le difficoltà.</div>

<h3>1. Quadro</h3>
<table>
<tr><td><b>Disturbo</b></td><td>neurobiologico</td></tr>
<tr><td><b>Insorgenza</b></td><td>età evolutiva; i disturbi si manifestano spesso nei primi 3 anni di vita, ma nei bambini ad alto funzionamento la diagnosi può arrivare in età adulta</td></tr>
<tr><td><b>Prevalenza</b></td><td>3 su 1000; più frequente nei maschi (rapporto 4:1)</td></tr>
<tr><td><b>Cause</b></td><td>sconosciute; ipotesi genetiche, ambientali, differenze nella biologia cerebrale</td></tr>
<tr><td><b>Diagnosi</b></td><td>osservazione del comportamento: non esiste un marker biologico. Valutazione da parte di un team, confronto con i criteri del DSM</td></tr>
</table>
<p class="small">Storia del termine: <b>Eugen Bleuler</b> (1910-11) identifica l'autismo come «pensiero circolare», dal greco <i>autos</i>, "in sé stesso". <b>Leo Kanner</b> (1943) descrive bambini con isolamento sociale, reazioni emotive eccessive, stereotipie, ecolalie, tratti ossessivi. <b>Hans Asperger</b> descrive casi simili con miglior funzionamento cognitivo e senza ritardi del linguaggio, ma con comunicazione pragmatica deficitaria. Il DSM-III introduce i "Disturbi Pervasivi dello Sviluppo"; il DSM-5 descrive compromissioni qualitative nell'interazione sociale e nella comunicazione e un repertorio limitato, ripetitivo e stereotipato di attività e interessi. I codici sono nell'ICD-11.</p>

<h3>2. Le sette aree di manifestazione</h3>
<div class="grid2">
<div class="card"><ul>
<li><b>Comunicazione</b> — difficoltà nel linguaggio verbale e non verbale, anche di articolazione;</li>
<li><b>Sociale</b> — interesse e capacità di avviare la comunicazione sociale compromessi;</li>
<li><b>Immaginativa</b> — interessi ristretti, abitudini e comportamenti rigidi, ripetitivi, stereotipati;</li>
<li><b>Ansia ed emotività</b> — modo anomalo di manifestare le emozioni; non riconoscono le emozioni negli altri;</li>
</ul></div>
<div class="card"><ul>
<li><b>Sensoriale</b> — ipo o ipersensibilità a stimoli di tipo diverso;</li>
<li><b>Funzioni esecutive</b> — difficoltà a pianificare, organizzarsi, modificare il comportamento in base al contesto;</li>
<li><b>Attentiva</b> — difficoltà a spostare l'oggetto dell'attenzione, a modificare azioni e routine, ad affrontare i cambiamenti e a passare da un'attività all'altra.</li>
</ul></div>
</div>
<p class="small">Indicatori precoci: nei primi 6 mesi debolezza (non assenza totale) dei comportamenti intersoggettivi e ipoattività; fino a 1 anno attenzione eccessiva agli oggetti e ridotto interesse per i volti; a <b>12-18 mesi</b> l'indicatore più attendibile: mancata risposta al nome, diminuita attenzione per i volti umani, assenza di <i>pointing</i>, deficit di imitazione.</p>

<h3>3. Undici cose da sapere</h3>
<ul>
<li>i bambini autistici <b>provano emozioni</b>, ma le vivono ed elaborano in modo diverso;</li>
<li>l'autismo ha origine neurobiologica;</li>
<li>non passa con l'età: dura tutta la vita;</li>
<li>serve tanto amore, che deve andare di pari passo con terapia e didattica;</li>
<li>bisogna essere empatici;</li>
<li>non tutti sono piccoli geni: alcuni presentano importanti difficoltà cognitive, comunicative e relazionali;</li>
<li>non sempre i loro comportamenti vanno considerati patologici;</li>
<li>è importante che il tutor si impegni a conoscerne tutte le problematiche;</li>
<li>trovare sempre i <b>punti di forza</b>;</li>
<li>non tutti sono chiusi in una bolla: il «vivere in un mondo tutto suo» è un meccanismo di difesa;</li>
<li>sono una <b>risorsa per i compagni</b>, perché i programmi didattici attivati portano benefici a tutta la classe.</li>
</ul>

<h3>4. Comportamenti problema: analizzare prima di reagire</h3>
<p>In molti bambini autistici è presente ipo o ipersensibilità verso stimoli esterni come luci e rumori. Alcune crisi sono causate da eccessiva stimolazione: un eccessivo chiasso in classe può portare a comportamenti non adeguati.</p>
<div class="box key"><b class="tag">Protocollo di osservazione</b>Quando compare un comportamento problema, l'insegnante analizza <b>quando</b> si verifica, il più precisamente possibile; <b>che cosa è successo prima</b>, per capire cosa ha scatenato la crisi; e <b>quanto tempo</b> impiega l'alunno per tornare in una situazione di controllo. Questo permette di capire quali variabili causano la crisi, quali fattori mantengono il comportamento e quali conseguenze produce.</div>
<h4>Comportamento oppositivo</h4>
<p>Può nascere dal fatto che la nostra richiesta giunge in un momento difficile: quando sono turbati, stanchi, ansiosi, stanno giocando con il gioco preferito, o semplicemente hanno fame o sonno. I bambini nello spettro hanno difficoltà a cambiare le attività quotidiane programmate. Quando comunichiamo occorre essere molto chiari e <b>mantenere la calma</b>, per non arrivare al comportamento oppositivo.</p>
<h4>Stereotipie motorie</h4>
<div class="box alert"><b class="tag">Regola</b>Le stereotipie motorie — girare su sé stessi, sfarfallio delle mani — <b>non vanno mai bloccate</b>: sono un modo per esprimere l'emozione che stanno provando, e spesso emergono in momenti di forte carico emotivo. Si può gradualmente <b>canalizzarle e modificarle</b> in gesti significativamente espressivi: dallo sfarfallio si può arrivare al battito delle mani, anche attraverso l'imitazione dell'adulto.</div>

<h3>5. Comunicazione: quattro categorie</h3>
<table>
<tr><th></th><th>Che cosa significa</th><th>Esempio</th></tr>
<tr><td><b>Funzionale</b></td><td>comunica in modo comprensibile</td><td>indica o tocca l'oggetto che desidera</td></tr>
<tr><td><b>Non funzionale</b></td><td>comunica in modo non adeguato</td><td>strappa dalle mani l'oggetto perché lo desidera ma non sa come chiederlo</td></tr>
<tr><td><b>Verbale</b></td><td>si esprime con il linguaggio verbale</td><td>—</td></tr>
<tr><td><b>Non verbale</b></td><td>si esprime con gesti</td><td>ci dà o ci indica l'oggetto che vorrebbe</td></tr>
</table>
<p>L'obiettivo non è eliminare la comunicazione non funzionale, ma <b>trasformarla</b> in funzionale, insegnando modi comprensibili di esprimere lo stesso bisogno.</p>

<h3>6. Ambiente e organizzazione</h3>
<ul>
<li>ambiente <b>ben predisposto e strutturato</b>, per ridurre l'ansia e mettere ordine nella mente;</li>
<li>organizzare gli spazi; creare schemi visivi per le attività; organizzare i compiti;</li>
<li>obiettivi personalizzati con attività <b>simili a quelle dei compagni</b>, con contenuti modificati o ridotti;</li>
<li>rispettare i tempi ed evitare cambiamenti bruschi, che creano ansia e irrequietezza;</li>
<li>per ogni compito dare un <b>tempo di inizio e di fine</b> adeguato, così che in quel tempo debba occuparsi solo di quel compito.</li>
</ul>
<h4>L'agenda visiva</h4>
<p>Organizzazione verticale in cui le attività da svolgere sono inserite in ordine temporale <b>dall'alto verso il basso</b>. Aiuta a individuare subito la prima attività e a sapere quali obiettivi raggiungere durante la giornata.</p>

<h3>7. Percorso didattico facilitato</h3>
<ul>
<li>il tutor <b>presenta in anticipo</b> il lavoro da svolgere;</li>
<li>usa materiali e metodi alternativi: giochi, schemi, immagini, per stimolare il canale visivo ed emotivo;</li>
<li>promuove l'impegno con un gettone come rinforzo;</li>
<li>mostra il lavoro svolto, stimolando verso l'autonomia personale.</li>
</ul>
<h4>Contesto inclusivo</h4>
<p>L'alunno deve restare in classe il più possibile, facendo le stesse cose dei compagni; i suoi spazi devono essere ampi e ordinati per trovare facilmente il materiale. Bisogna insegnargli a <b>chiedere aiuto</b>, servendosi se necessario di immagini, e incoraggiarlo a condividere le sue cose.</p>

<h3>8. Insegnare lettura, scrittura e matematica</h3>
<div class="grid2">
<div class="card"><h4>Lettura</h4><p>Stampare, plastificare e ritagliare tutte le lettere. Si parte dalle <b>vocali</b>: si mostrano e si pronunciano, poi si chiede di indicare la A; dopo che la indica si motiva con un <b>rinforzo</b> e si procede con le altre. Quando riconosce tutte le vocali si passa alle consonanti con la stessa modalità, poi alle sillabe. Infine schede in cui individuare e scrivere la sillaba corretta nel quadratino vuoto.</p></div>
<div class="card"><h4>Scrittura</h4><p>Si inizia con il <b>pregrafismo</b>, dai tratti semplici alla scrittura vera e propria. Si verbalizza il nome della lettera guidando il movimento della mano; nel tempo si riduce gradualmente l'aiuto. Iniziare con le <b>maiuscole</b>; usare una varietà di strumenti grafici; usare schede di pregrafismo stampate; stimolare l'attività quotidianamente.</p></div>
<div class="card"><h4>Matematica</h4><p>Affiancare <b>sempre un'immagine a ogni numero</b>. Stampare, plastificare e ritagliare i numeri da 0 a 10, ampliando gradualmente. Il bambino impara a contare associando a ogni numero un simbolo a cui è associata una quantità. Insegnare a scriverli con schede di pregrafismo predisposte con i numeri.</p></div>
<div class="card"><h4>Concetti topologici</h4><p>Importanti perché permettono di comprendere la grandezza e la posizione nello spazio.</p></div>
</div>
<h4>Altre attività</h4>
<ul>
<li><b>calendario giornaliero</b>: giorni, numeri, mesi, anno, stagioni e tempo meteorologico da scegliere ogni giorno — insegna il trascorrere del tempo e delle stagioni;</li>
<li><b>labirinti</b>: stimolanti e divertenti, aumentano il livello di attenzione;</li>
<li><b>associazione nome-immagine</b>: individuare e leggere il nome corretto dell'oggetto disegnato; stimola percezione visiva, linguaggio, vocabolario;</li>
<li><b>comprensione di frase</b> tramite associazione fra immagine, domanda e risposta.</li>
</ul>

<h3>9. Token economy</h3>
<p>Sistema di rinforzo che prevede la consegna di un <b>gettone</b>: a ogni obiettivo raggiunto il bambino riceve un gettone e, al raggiungimento di un numero prefissato, riceve il premio <b>da lui scelto</b>. Alla fine di ogni attività è importante gratificare.</p>

<h3>10. Approcci terapeutici</h3>
<div class="grid2">
<div class="card"><h4>Psicomotricità</h4><p>Utile in età prescolare: presa di coscienza di sé (riconoscere i propri confini corporei attraverso il gioco), presa di coscienza dell'altro, presa di coscienza delle regole, sviluppo di strategie per fronteggiare le novità (usare lo stesso gioco in modi diversi), pianificazione degli obiettivi a breve, medio e lungo termine.</p></div>
<div class="card"><h4>Logopedia</h4><p>Non solo per il bambino non verbale: supporta sia l'alto sia il basso funzionamento. Obiettivi: articolare bene le parole; comprendere la comunicazione verbale e non verbale; produrla in maniera funzionale; sviluppare l'iniziativa comunicativa; favorire lo scambio anche con domande e risposte.</p></div>
<div class="card"><h4>ABA</h4><p><i>Applied Behavior Analysis</i>. Analizza gli <b>antecedenti</b> (dinamiche interne o ambientali che portano a quel comportamento) e i <b>conseguenti</b> (ciò che succede dopo). Strategie: rinforzo, estinzione, controllo degli stimoli, generalizzazione, acquisizione delle autonomie.</p></div>
<div class="card"><h4>Progettazione in rete</h4><p>Interventi congiunti (obiettivi – strategie – ricerca) fra <b>famiglia</b> (coinvolta nel PEI e fonte preziosa di informazioni), <b>scuola</b> (approccio normativo e progettuale, considerandolo un alunno qualunque) e <b>servizi specialistici</b> (diagnosi funzionale, profilo dinamico funzionale, PEI).</p></div>
</div>

<h3>11. Diritti</h3>
<p>Oltre alla <b>L. 104/1992</b>, la <b>L. 134 del 18 agosto 2015</b> rappresenta un impegno specifico verso le persone con disturbi dello spettro autistico: aggiornare i livelli essenziali di assistenza, garantire il funzionamento e qualificare i servizi, formare gli operatori sanitari, definire équipe territoriali, promuovere l'informazione, coordinare interventi e servizi, incentivare progetti di formazione, assicurare strutture adeguate sul territorio, promuovere l'inserimento lavorativo.</p>
<div class="box key"><b class="tag">L'obiettivo</b>Nei confronti di un bambino con disturbo dello spettro autistico l'obiettivo è «<b>imparare a fare da solo</b>»: possibile solo attraverso attività, strategie e una routine quotidiana che lo renda progressivamente indipendente.</div>

id:"sensoriale", parte:"Altri BES", titolo:"Disabilità sensoriale e didattica individualizzata", durata:"30 min",
html:`
<p class="lead">Disabilità visiva, uditiva o multisensoriale incidono su percezione, comunicazione e apprendimento. L'obiettivo, per chi non ha compromissioni intellettive, è garantire l'<b>adeguatezza della preparazione</b> trovando le vie — anche tecnologiche — per i migliori risultati.</p>

<h3>1. Disabilità visiva</h3>
<p><b>Ipovisione</b>: riduzione o perdita della funzione visiva non correggibile con occhiali, terapie mediche o interventi chirurgici, riconducibile a varie patologie oculari.</p>
<p>Dipende dall'interazione di più variabili: acuità visiva (in decimi); campo visivo (centrale, periferico, maculare); sensibilità ai colori e al contrasto; sensibilità alla luce diurna o cecità notturna; qualità della visione (sfocata, distorta). Ne derivano condizioni percettive <b>estremamente soggettive e difficilmente standardizzabili</b>: ipovisione centrale, periferica, alterazione dei colori, abbagliamento, cecità notturna.</p>
<p class="small">Principali cause nell'infanzia: atrofia ottica, cataratta congenita, albinismo, miopie, patologie maculari, glaucoma, fibroplasia retrolentale, patologie corneali.</p>
<h4>Difficoltà scolastiche</h4>
<ul>
<li><b>apprendimento</b> — l'accesso alle informazioni veicolate dalla vista; difficoltà nella lettura e scrittura, ma anche nella comprensione di concetti astratti e nella memorizzazione;</li>
<li><b>orientamento e mobilità</b> — dentro e fuori l'edificio scolastico;</li>
<li><b>socializzazione</b> — partecipazione alle attività di gruppo, rischio di isolamento;</li>
<li><b>autostima e immagine di sé</b> — soprattutto se lo studente non si sente supportato e compreso.</li>
</ul>
<h4>Come lavorare</h4>
<ul>
<li><b>Braille e materiali tattili</b>: mappe tattili, modelli tridimensionali, carte con superfici diverse, libri tattili con varie texture, schede tattili per abbinamento, conteggio, riconoscimento di forme;</li>
<li><b>attività sensoriali</b>: esplorazione di suoni per l'orientamento spaziale (campanelli); esperienze tattili con plastilina e materiali modellabili, anche bendati; laboratori multisensoriali che coinvolgano olfatto e gusto; giochi con la luce a diverse intensità e colori per stimolare la percezione residua negli ipovedenti;</li>
<li><b>orientamento e mobilità</b>: percorsi con punti di riferimento tattili e sonori; tecniche di accompagnamento; ausili come il bastone bianco;</li>
<li><b>inclusione</b>: includerlo in tutte le attività di classe adattando le proposte; favorire momenti di gioco e apprendimento condiviso; sensibilizzare la classe.</li>
</ul>
<div class="box key"><b class="tag">Tre regole d'oro</b>
<b>Verbalizzare</b> tutte le azioni e le istruzioni, sia per l'alunno con disabilità visiva sia per i compagni. <b>Ripetere</b> le esperienze e le attività più volte, per favorire memorizzazione e consolidamento. <b>Coinvolgere attivamente</b>, incoraggiando e sostenendo.</div>
<h4>Tecnologie assistive</h4>
<p><span class="pill">dattilobraille</span><span class="pill">cubaritmo</span><span class="pill">dattiloritmica</span><span class="pill">display braille</span><span class="pill">screen reader</span><span class="pill">tastiera estesa ad alto contrasto</span><span class="pill">videoingranditori</span><span class="pill">stampanti braille</span><span class="pill">software specifici</span></p>

<h3>2. Disabilità uditiva</h3>
<p>Classificazione del Bureau International d'Audiophonologie, in base alla perdita uditiva misurata in decibel:</p>
<table>
<tr><th>Grado</th><th>Soglia uditiva</th></tr>
<tr><td>Sordità lieve</td><td>fra 20 e 40 dB</td></tr>
<tr><td>Sordità moderata</td><td>fra 40 e 70 dB</td></tr>
<tr><td>Sordità grave</td><td>fra 70 e 95 dB</td></tr>
<tr><td>Sordità profonda</td><td>uguale o superiore a 95 dB</td></tr>
</table>
<p class="small">Principali cause: genetiche e sindromiche; malattie virali gravi (parotite, rosolia materna in gravidanza, scarlattina, febbre alta); farmaci ototossici; emorragie dell'orecchio interno; fratture dell'osso temporale e traumi; nascita molto prematura.</p>
<h4>Difficoltà scolastiche</h4>
<ul>
<li><b>acquisizione del linguaggio</b> — la sordità può compromettere l'acquisizione spontanea del linguaggio verbale, parlato e scritto;</li>
<li><b>comunicazione in classe</b> — la didattica si basa principalmente sulla comunicazione verbale;</li>
<li><b>comprensione dell'orale</b> — la lettura labiale richiede un grande sforzo attentivo ed è un metodo limitato;</li>
<li><b>apprendimenti</b> — errori nella comprensione di testi scritti; omissioni, sostituzioni o aggiunte nella morfologia, in particolare con <b>preposizioni, articoli e pronomi</b>;</li>
<li>possibili difficoltà di attenzione e comportamento.</li>
</ul>
<h4>Come lavorare</h4>
<ul>
<li><b>comunicazione</b>: integrare la <b>LIS</b> nelle attività quotidiane (saluto, presentazione, narrazione di storie); sottotitolazione e trascrizione di lezioni e video; comunicazione aumentativa alternativa con immagini, simboli e gesti; giochi di ruolo e mimi; attività di ascolto attivo con supporti visivi e tattili, come la percezione delle vibrazioni;</li>
<li><b>apprendimento</b>: insegnamento <b>bimodale</b> (parlato e segni) o <b>bilingue</b> (parlato e LIS); materiale didattico personalizzato, visivamente chiaro, con immagini, video e animazioni; apprendimento cooperativo; tecnologie assistive;</li>
<li><b>socializzazione</b>: attività ludiche inclusive; incontri con persone sorde che condividano la loro esperienza come modelli positivi; formazione dei compagni sulle esigenze; spazi di ascolto e confronto per esprimere le proprie emozioni.</li>
</ul>
<h4>Ambiente e personalizzazione</h4>
<ul>
<li>adattare le attività al tipo e grado di perdita uditiva, alle competenze linguistiche e alle preferenze individuali;</li>
<li>coinvolgere la famiglia; assicurare la formazione degli insegnanti;</li>
<li>aule <b>ben illuminate, acusticamente confortevoli e prive di rumori di fondo</b>.</li>
</ul>
<p>Tecnologie assistive: <span class="pill">sistemi FM e microfoni direzionali</span><span class="pill">sottotitoli in tempo reale</span><span class="pill">videolezioni con LIS</span><span class="pill">app di trascrizione automatica</span> — oltre a protesi acustiche e impianti cocleari.</p>

<h3>3. Principi della didattica individualizzata</h3>
<ul>
<li>adattamento dei materiali; ambiente facilitante;</li>
<li>strumenti compensativi e dispensativi; valutazione personalizzata; partecipazione attiva;</li>
<li>lezione supportata da elementi visivi e uditivi; sintesi e mappe concettuali;</li>
<li>tutoraggio individuale; collaborazione con la famiglia; monitoraggio dei progressi.</li>
</ul>
<h4>Comunicazione efficace</h4>
<p>Linguaggi alternativi e aumentativi; chiarezza espositiva; contatto visivo; <b>verifica della comprensione</b>; supporti visivi e gestuali.</p>

<h3>4. Un caso reale: E.M., quarta primaria</h3>
<p>Bambina con impianto cocleare, ben inserita nel gruppo classe, con ottimi rapporti coltivati anche fuori dalla scuola.</p>
<ul>
<li>da inizio anno ha un <b>programma personalizzato in matematica</b>, strutturato sulle sue difficoltà; ogni circa tre mesi si fa il punto per verificare il raggiungimento degli obiettivi;</li>
<li>nelle materie di studio segue il programma della classe, ma con carico di lavoro <b>notevolmente ridotto e semplificato</b>; allo stesso modo le verifiche;</li>
<li>da marzo, difficoltà anche in italiano: si è valutata la diversificazione del programma di grammatica, mentre durante le ore di "testi" resta in classe per mantenere presenza e partecipazione, come per geometria, inglese, motoria e religione;</li>
<li>quando esce dalla classe è sempre inserita in un <b>piccolo gruppo</b> che segue la sua stessa programmazione, gruppo che varia in base alle materie;</li>
<li><b>diario di viaggio</b>: un quaderno in cui racconta una giornata a sua scelta; rientrata a scuola, riguardando le immagini con l'insegnante o l'assistente, riporta alla memoria i diversi aneddoti. Prima non ricordava mai ciò che aveva fatto il giorno precedente e non voleva parlare del proprio vissuto; ora racconta in autonomia e nei minimi dettagli.</li>
</ul>
<div class="box"><b class="tag">Che cosa insegna questo caso</b>Il piccolo gruppo variabile evita l'isolamento dell'uscita individuale; la permanenza in classe nelle materie meno linguistiche mantiene l'appartenenza; e uno strumento semplice come un quaderno illustrato ha prodotto un cambiamento nella memoria autobiografica e nella disponibilità a raccontarsi.</div>

id:"disabilita", parte:"Altri BES", titolo:"Disabilità intellettiva: obiettivi, aree, autonomie", durata:"35 min",
html:`
<p class="lead">Qualunque schema standard di obiettivi e azioni educative «deve essere smontato e flessibilmente rimontato a partire da ogni specifica situazione». Quello che segue è un quadro da adattare, non un modello da applicare.</p>

<h3>1. Sei criteri pedagogici, anche come autoverifica</h3>
<ul>
<li>bilanciare lo <b>star bene a scuola</b> per l'integrazione nel presente con la conquista di strumenti di integrazione sociale futura;</li>
<li>creare condizioni di successo negli apprendimenti, per assicurare una positiva percezione di sé e un'identità sicura e stabile;</li>
<li>impostare il percorso di crescita procedendo <b>per tentativi ed errori</b>;</li>
<li>riconoscere le situazioni di svogliatezza reattiva (<b>evitamento</b>) e impegnarsi a scioglierle, suscitando comportamenti di fronteggiamento;</li>
<li>adottare con grande equilibrio il duplice principio di <b>gradualità/gratificazione</b>;</li>
<li>usare uno stile comunicativo fatto di <b>empatia e fermezza</b>, evitando il circolo vizioso rifiuto–braccio di ferro–rifiuto.</li>
</ul>

<h3>2. I tre obiettivi circolarmente connessi</h3>
<div class="box key"><b class="tag">Identità · competenza · autonomia</b>L'acquisizione di competenze rafforza e costruisce l'identità, sia perché la arricchisce di conoscenze, abilità e capacità di relazione, sia perché la alimenta del senso di accrescimento che deriva dal sentirsi capace di procedere con successo di fronte al nuovo. Questo processo crea gradi progressivi di autonomia, in un circolo virtuoso che deve durare, migliorando, per tutta la vita.</div>
<p>Il quadro degli obiettivi assume un disegno diverso a seconda delle situazioni: per un alunno paraplegico con gravi difficoltà nell'uso della parola si porrà prima di tutto il problema della <b>comunicazione</b>, chiave per entrare in relazione; per un alunno con lieve ritardo mentale si guarderà in primo luogo agli <b>aspetti cognitivi</b> e alla complessità del linguaggio.</p>

<h3>3. Le sei aree di sviluppo</h3>
<table>
<tr><th>Area</th><th>Contenuti</th></tr>
<tr><td><b>Comunicazione</b></td><td>non verbale: qualità dello scambio, ritmicità · verbale: estensione (azioni e cose, pensieri, intenzioni, emozioni, spiegazioni)</td></tr>
<tr><td><b>Linguistica, culturale/disciplinare, matematica e scientifica</b></td><td>lingua orale e scritta; dimensione culturale-disciplinare (storia, geografia, aspetti descrittivi delle scienze); funzioni logiche prematematiche, matematica di base, scienze</td></tr>
<tr><td><b>Relazione</b></td><td>con il contesto scuola (schemi spazio-temporali, ritualità, appartenenza); con sé stesso; con gli altri, adulti e compagni</td></tr>
<tr><td><b>Espressività corporea, figurativa, ritmico-musicale</b></td><td>abilità sensoriali (discriminazione, nominazione); motricità globale e fine, prassie; rappresentazione visuo-spaziale; ritmicità e funzione musicale</td></tr>
<tr><td><b>Funzionamento cognitivo</b></td><td>attenzione, memoria, organizzazione spazio-temporale; pensiero operatorio concreto e ipotetico-deduttivo</td></tr>
<tr><td><b>Autonomie</b></td><td>spostamenti; compiti di apprendimento ed esecuzione di consegne; compiti di vita quotidiana; <b>capacità di chiedere aiuto</b>; iniziativa nella comunicazione e nella relazione</td></tr>
</table>

<h3>4. Comunicazione</h3>
<p>Quando la comunicazione presenta gravi limiti sia nel linguaggio orale sia in quello scritto si ricorre alla <b>Comunicazione Aumentativa e Alternativa (CAA)</b>, che aiuta a riconoscere gli elementi migliorabili e fornisce codici e soluzioni tecnologiche sostitutivi delle funzioni deficitarie.</p>
<p>Quando l'articolazione verbale non è preclusa va potenziata: suoni vocali e consonantici meglio distinti, corretta ritmicità della respirazione. Occorre contemporaneamente insegnare ai compagni un corretto approccio comunicativo, che consiste soprattutto nell'<b>attendere i tempi</b> di formulazione ed evitare sovrapposizioni o atteggiamenti sostitutivi.</p>
<ul>
<li><b>Nell'autismo</b> — ridurre la forte prevalenza di ciò che viene dall'interno rispetto a ciò che si lascia entrare da fuori. Portarlo a esprimere comunque qualcosa, prolungare la sua comunicazione, portarlo ad ascoltare l'altro. Il mondo di relazioni è ristrettissimo: l'obiettivo è allargarlo progressivamente a più persone, ambienti, situazioni, introducendo gradi successivi di reciprocità.</li>
<li><b>Nel ritardo mentale</b> — più qualità nell'articolazione fonologica; più pulizia nella ritmicità e reciprocità dello scambio; più estensione nei contenuti (cose, azioni, intenzioni proprie e altrui, emozioni, situazioni) e nelle situazioni comunicative, compresi gli schemi di ritualità relazionale: le forme del salutare nelle diverse circostanze, fare acquisti, collaborare in un gruppetto di lavoro.</li>
</ul>

<h3>5. Le discipline come campi semantici</h3>
<p>L'alunno con disabilità intellettiva deve seguire <b>a suo modo</b> il programma della classe, attraverso i medesimi campi semantici: immagini e parole che evocano le grandi civiltà, quadri geografici, le stelle, semplici oggetti e fenomeni delle scienze.</p>
<div class="box alert"><b class="tag">Il criterio della significatività</b>Ciò che <b>non è suscettibile di rappresentazione mentale non deve essere proposto</b> all'alunno. Solo ciò che può essere ricostruito in immagine mentale acquista carattere concreto e dunque valore di significato. Sarebbe privo di senso far apprendere elementi nozionali di cui l'alunno non abbia costruito una rappresentazione interna.</div>
<p><b>Un caso.</b> Un'alunna di terza media con sindrome di Down aveva imparato sulla cartina muta i fiumi dell'Asia; li indicò e nominò correttamente davanti alla classe, che assisteva con ammirazione e affetto. La bambina però non sapeva che cos'è un fiume, e non sembrava in grado di capire che nasce in montagna, scende, attraversa la pianura e si getta nel mare: non era in grado di costruirsene la rappresentazione mentale.</p>
<p class="small">I testi per gli argomenti devono essere semplici ma <b>non infantilizzanti</b>: il ragazzo con ritardo mentale si vede come un ragazzo e ha bisogno di sentirsi "grande".</p>

<h3>6. Lingua scritta e matematica</h3>
<p>Il possesso delle abilità di lettura e scrittura è condizione centrale per l'autonomia sociale, ancor più oggi con le tecnologie della comunicazione. Tali abilità sono <b>accessibili in modo completo</b> all'alunno con lieve o medio ritardo mentale: per questo costituiscono obiettivi centrali. Va data grande importanza alla pratica fonologica: compitazione, sillabazione anche ritmica, versi di poesie, canzoni.</p>
<p>Obiettivo fondamentale, oltre alla tecnica, è il <b>livello funzionale</b>: leggere semplici informazioni e produrre semplici messaggi a scopo pratico. Ma la lettura va coltivata anche per il piacere che dà — è la dimensione culturale del sapere, che in quanto diritto fondamentale deve appartenere anche all'alunno con disabilità.</p>
<p>Per la matematica: si possiede il <b>concetto di numero</b> quando si comprende che cinque scatoline, cinque bambini e cinque case sono lo stesso numero di cose, e quando si comprende la relazione fra cinque case e sei, quattro o dieci. In quel caso è giusto praticare le quattro operazioni al livello accessibile, secondo un criterio funzionale, perché è utile saper fare piccole addizioni nella vita quotidiana.</p>
<p>Il ritardo mentale presenta spesso forti <b>settorialità</b>: può esserci l'alunno che scrive e legge con molta precisione ma non riesce a comprendere che due monete da un euro e una da due euro hanno lo stesso valore. Importante la valenza logica del linguaggio: i quantificatori (molti, pochi, tutti, alcuni, più di, meno di) e i termini chiave della logica spaziale (sopra, sotto, davanti, dietro) e temporale (prima, dopo, ieri, domani).</p>

<h3>7. Relazione con sé e con gli altri</h3>
<p>Per l'autostima ha valore anche l'<b>esposizione dei lavori</b> dell'alunno in aula o alla festa della scuola, o fotografie e filmati delle attività con i compagni: creano un ambiente che restituisce il senso di essere parte della classe.</p>
<div class="box"><b class="tag">Due errori da evitare nel gruppo classe</b>
Non far percepire il compagno con disabilità come <b>fonte di doveri</b>, e dunque come un peso, con conseguenti sensi di colpa che accentuano quel senso di pesantezza.<br>
Evitare che un compagno particolarmente coinvolto ne faccia una <b>missione</b>, entrando in situazioni non fisiologiche che rischiano di togliere respiro alla sua vita di adolescente.</div>
<p>Va invece favorita la partecipazione a feste di compleanno o altre occasioni fuori dalla scuola. Nel libro di Pontiggia <i>Nati due volte</i> è indimenticabile la gratitudine con cui l'autore ricorda i ragazzi che, semplicemente, prendevano con loro il compagno disabile quando si ritrovavano: <b>un semplice stare insieme senza nessun'altra specificazione</b>.</p>

<h3>8. Le ritualità come struttura cognitiva</h3>
<p>La scuola è un contesto organizzato secondo spazi, tempi e regole, scandito da ritualità fortemente unificanti. Il ragazzo con ritardo mentale o con patologie della comunicazione deve essere condotto a interiorizzare questi schemi, che hanno una valenza profondamente rassicurante sul piano emotivo, cognitivo e dell'autoidentificazione.</p>
<ul>
<li><b>fare l'appello</b>: il ragazzo attende con fortissima intensità il momento in cui anche lui dirà «presente!»;</li>
<li><b>l'intervallo</b>: abbandonare per tempo l'auletta del computer per essere con la classe prima che inizi;</li>
<li><b>termine delle lezioni</b>: se si è all'esterno, rientrare in classe prima del suono della campanella;</li>
<li>curare gli <b>spostamenti</b>, dando loro un'impronta determinata e ritualizzandoli.</li>
</ul>
<div class="box alert"><b class="tag">Da evitare assolutamente</b>Muoversi con libertà per gli ambienti della scuola insieme al ragazzo senza alcuna attenzione alle scadenze dell'orario scolastico, facendo della scuola un contenitore indifferenziato, una struttura semplicemente contenitiva.</div>

<h3>9. Corpo, prassie, espressività</h3>
<ul>
<li>esporre l'alunno a materiali e sensazioni visivi, tattili, olfattivi, gustativi, acustici e cinestetici, accompagnandoli con un preciso <b>lavoro lessicale</b>: arrivare a nominare con chiarezza il ruvido, il liscio, il morbido, il duro potenzia la discriminazione della sensazione stessa;</li>
<li>lavorare sullo <b>schema corporeo</b> con attività di imitazione, gioco di movimento, manipolazione di oggetti di grossa taglia; nominazione delle parti del corpo; rappresentazione grafica;</li>
<li>curare i momenti di contorno del movimento: mettere la tuta, spogliarsi e rivestirsi anche insieme ai compagni e con il loro aiuto, lavarsi, riporre gli indumenti — sono fortemente costruttivi di un buon rapporto con il proprio corpo;</li>
<li><b>prassie</b>: allacciare i bottoni, legare i lacci, usare le posate, versare l'acqua, scartare una caramella, usare una molletta, una penna a scatto; a livelli più alti far girare una trottola, incartare un pacchetto;</li>
<li><b>rappresentazione visuo-spaziale</b>: carta topografica dell'aula e dell'edificio, con esecuzione di percorsi sulla base di una mappa elaborata con l'insegnante, purché ben calibrata sul livello cognitivo;</li>
<li><b>attività teatrale</b>: assegna un'identità preconfezionata in cui l'alunno si percepisce con particolare nettezza; entrare in un personaggio quasi libera dai propri limiti, e migliora inaspettatamente movimento, parola, emissione della voce.</li>
</ul>

<h3>10. Metacognizione e dialogo interno</h3>
<p>Esiste un'area di «igiene del funzionamento mentale» che richiede di mettere ordine nel modo di compiere le operazioni di pensiero e di incrementare l'attenzione. Si usa il dialogo per indurre consapevolezza di come si svolgono i compiti, facendo rallentare, riflettere, ripetere.</p>
<p>Questa consapevolezza è un processo metacognitivo che avviene dapprima con il sostegno esterno delle domande del docente, poi viene interiorizzato: l'alunno diventa capace di farsi autonomamente domande sul proprio operare. È importante che le domande divengano <b>schemi di autocontrollo</b>, cioè insiemi di domande riferiti a compiti specifici.</p>
<p>L'alunno va portato a ricorrere al <b>dialogo interno</b>, a bisbigliare fra sé e sé dialogando sul compito con domande e risposte, fino a dirsi la scelta del passo giusto da fare. Il docente può bisbigliare lui stesso le proprie operazioni mentre opera, per induzione imitativa.</p>

<h3>11. Autonomie</h3>
<p>Il conseguimento della massima autonomia è l'obiettivo generale di tutta l'azione della scuola: spostamenti interni progressivamente più complessi; spostamenti esterni (andare a casa, venire a scuola, usare il mezzo pubblico, fare il biglietto, convalidarlo).</p>
<div class="box norm"><b class="tag">Un punto giuridico che i docenti devono conoscere</b>Gli spostamenti interni in autonomia <b>devono essere ufficialmente programmati</b> nella forma di progetto o unità di apprendimento. È importante anche dal punto di vista della responsabilità legale del docente. In una vicenda tragica — una bambina con sindrome di Down morta in un incendio mentre andava da sola a fare fotocopie — poiché l'attività risultava regolarmente programmata come progetto di progressiva acquisizione di autonomia, la regolarità della posizione delle docenti e della dirigente fu riconosciuta dal giudice già nelle indagini preliminari.</div>
<p>Aspetto di capitale importanza: formare l'alunno a <b>chiedere aiuto</b> nelle situazioni in cui è necessario per superare una barriera o orientarsi. È un'abilità complessa che comprende aspetti profondi della personalità: aver fiducia in sé, saper superare la timidezza, sapersi spiegare con chiarezza e con calma.</p>

<h3>12. Le sei operazioni della programmazione</h3>
<ol>
<li>rilevazione delle condizioni di partenza, per individuare e calibrare gli obiettivi;</li>
<li>costruzione delle esperienze di apprendimento e, specularmente, dell'azione didattica;</li>
<li>modalità della loro concreta realizzazione;</li>
<li>verifica in itinere dei risultati;</li>
<li><b>autoverifica della propria azione</b> educativa e didattica, con aggiustamenti di ritorno;</li>
<li>verifica e valutazione finali.</li>
</ol>
<p class="small">L'insieme di queste operazioni costituisce la documentazione che consente la continuità dell'azione nei vari passaggi di vita.</p>

html:`
<p class="lead">Tre situazioni reali documentate nelle dispense: un ragazzo con quadro complesso in comorbilità, una studentessa di liceo con dislessia e l'esperienza di un docente di lettere alle prese con il latino.</p>

<h3>Caso 1 — Francesco, 12 anni</h3>
<h4>Presentazione</h4>
<p>Segnalato dalla madre. Presenta difficoltà nella comprensione anche di concetti elementari, attenzione labile, difficoltà a eseguire i compiti se non supportato, necessità di continue pause. Esibisce comportamenti oppositivi, rivolti principalmente alla madre. Non riconosce l'autorevolezza dell'adulto.</p>
<h4>Diagnosi</h4>
<p>Disabilità intellettiva di grado lieve (ICD-10 F70.0); disturbo evolutivo delle capacità scolastiche non specificato (F81.9); ADHD sottotipo misto (F90.2) con tratti oppositivi. Natura handicap psichico, suscettibile a modificazioni significative.</p>
<ul>
<li><b>Valutazione cognitiva</b> — scala WISC-IV: punteggio al di sotto della norma per età (QI totale 50).</li>
<li><b>Attenzione e funzioni esecutive</b> — batteria NEPSY-II: importanti difficoltà di controllo degli impulsi e di attenzione.</li>
<li><b>Abilità scolastiche</b> — atteggiamento oppositivo-provocatorio, impulsività e facile distraibilità <b>tanto da non poter procedere</b> alla prova di lettura e comprensione del testo. Eloquio organizzato, ma con errori ricorrenti di esposizione verbale.</li>
<li><b>Osservazione del comportamento</b> — si è adattato al contesto senza difficoltà, disponibile a eseguire le prove; pattern inattentivo con livelli di attenzione fluttuante.</li>
</ul>
<h4>Il setting</h4>
<p>Ambiente neutro privo di rumori · contesto privo di distrazioni · assenza di altri soggetti.</p>
<h4>Attività svolte</h4>
<div class="grid2">
<div class="card"><ul>
<li><b>Agenda visiva</b> per pianificare, suddividendo il tempo e alternando compiti, pause e attività</li>
<li><b>Scrittura e prescrittura</b>: linee curve, rette, cerchi, poi le singole lettere</li>
<li><b>Copiatura e dettatura</b></li>
<li><b>Schede didattiche</b>: completare parole inserendo le sillabe mancanti con supporto visivo dell'immagine</li>
<li><b>Disegni simmetrici</b>: coordinazione oculo-manuale, riconoscere e rispettare i confini, orientarsi nello spazio</li>
</ul></div>
<div class="card"><ul>
<li><b>Lettura</b>: potenziamento mirato alla <b>correttezza più che alla scorrevolezza</b>, con esercizi di riconoscimento sillaba-parola</li>
<li><b>Nomi, cose, città</b>; <b>Indovina chi?</b>; <b>costruzioni</b> (gli oggetti costruiti diventano protagonisti di storie inventate)</li>
<li><b>Forme e sequenze</b>: coordinazione, problem solving, fiducia nelle proprie abilità</li>
<li><b>Tavola delle tabelline</b>; <b>Memory</b> per memoria e soglia di attenzione</li>
<li><b>Morra cinese</b>: gioco-attesa per imparare a rispettare il turno e gestire il tempo dell'attesa</li>
<li><b>Token economy</b> e lavoro sul <b>riconoscimento delle emozioni</b></li>
</ul></div>
</div>
<h4>Obiettivi raggiunti</h4>
<p>Miglioramento della grafo-motricità · miglioramento nell'esposizione orale · rispetto dei tempi di attesa · miglioramento della partecipazione · gestione e diminuzione della frustrazione · aumento della motivazione · miglioramento dei tempi attentivi.</p>
<div class="box key"><b class="tag">Che cosa insegna</b>Nessuna delle attività è "specialistica": sono giochi da tavolo, schede e routine. La differenza l'hanno fatta il <b>setting</b> (privo di distrazioni e di altri soggetti), la <b>struttura del tempo</b> (agenda visiva, alternanza compito-pausa) e il lavoro parallelo su comportamento ed emozioni. Il DSM-5 ricorda che nella disabilità intellettiva lieve la comunicazione e il linguaggio sono più concreti o immaturi rispetto all'età, il giudizio sociale è immaturo e la persona è a rischio di essere manipolata: la <b>credulità</b> è parte del quadro e va tenuta presente nel lavoro educativo.</div>

<h3>Caso 2 — Luca, 10 anni, quinta primaria</h3>
<p>Diagnosi rilasciata da équipe multidisciplinare ASL: <b>dislessia evolutiva</b> (gravità media), <b>disortografia</b>, <b>disgrafia</b>, <b>discalculia evolutiva</b> con profilo misto (procedurale e semantico).</p>
<p>Luca è molto intelligente, curioso, con buon pensiero logico e creativo, ma manifesta forte frustrazione durante le attività scolastiche, frequenti blocchi emotivi e scarsa autostima.</p>
<p>Nel PDP sono previste: sintesi vocale, mappe concettuali, calcolatrice; tempi aggiuntivi e verifiche orali; esclusione dalla valutazione ortografica; pianificazione settimanale degli obiettivi.</p>
<div class="box"><b class="tag">Da discutere in gruppo</b>Quattro diagnosi in comorbilità significano che <b>il disturbo risultante è superiore alla somma</b>. Il piano non può essere la somma di quattro elenchi di strumenti: serve una gerarchia di priorità, e in questo caso la componente emotiva — blocchi, frustrazione, autostima — è parte del quadro, non un contorno.</div>
<p>Le domande su questo caso sono nel quiz in fondo alla pagina.</p>

<h3>Caso 3 — Insegnare lettere al liceo</h3>
<p>Esperienza di un docente di lettere in un liceo paritario, indirizzi scientifico, scienze umane e linguistico.</p>
<h4>Grammatica latina, biennio scienze umane</h4>
<p>Due studentesse con dislessia in prima liceo, docente alla prima esperienza. Percorso:</p>
<ol>
<li><b>Ottobre</b> — esercizio svolto con tutta la classe: le <b>emoji sostituiscono le parole</b> e la classe inserisce le locuzioni latine come soggetto, verbo e complemento oggetto.</li>
<li><b>Nei mesi successivi</b> — in un'ora settimanale di recupero pomeridiano, lavoro su supporto visuale: <b>un colore per ciascuna funzione base dei casi latini</b>. Dopo alcuni mesi si passa dall'evidenziare l'intera parola alla sola <b>desinenza</b>.</li>
<li><b>Secondo anno</b> — schemi dinamici su supporto multimediale da usare <b>durante le verifiche</b>: una schermata con tutte le desinenze degli aggettivi differenziate per colore; nelle altre schermate un aggettivo senza desinenza, a cui basta copiare e incollare la colonna con la declinazione corrispondente.</li>
</ol>
<p><b>Bilancio del docente</b>, riportato senza indulgenza: l'esperienza ha aiutato le studentesse a raggiungere la sufficienza secondo gli obiettivi minimi e a procedere verso il triennio, ma il bilancio finale non è soddisfacente, sia per il campione ridottissimo sia per la mancata occasione di proseguire. Una nota positiva: alcuni strumenti predisposti per le studentesse con dislessia <b>potrebbero essere utili all'intera classe</b>, il che porta a una riflessione per una didattica più inclusiva e meno differenziata.</p>
<h4>Tre nodi aperti sulle prove scritte</h4>
<div class="grid2">
<div class="card"><h4>Font DSA-friendly</h4><p>Verifiche preparate con Open-Dyslexic, font gratuito, e <b>somministrate in questo formato a tutta la classe</b> (in una prima con 4 studenti con DSA su 14).</p></div>
<div class="card"><h4>Il tempo è la chiave</h4><p>Con una studentessa di linguistico si è arrivati a temi «pressoché perfetti per forma e contenuto», ma aderenti solo al 50% delle richieste, con il 50% di tempo aggiuntivo. Con tempo sufficiente scrive con buona proprietà di linguaggio, anche senza schemi. La domanda resta aperta: come conciliare questa necessità con la didattica quotidiana?</p></div>
<div class="card"><h4>Disgrafia e disortografia in quinta</h4><p>Gli studenti usano il computer per i temi in classe. Due esiti diversi: chi risolve con il supporto multimediale la maggior parte delle problematiche, presentando temi di ottimo livello; e chi mantiene gravi errori di ortografia e sintassi nonostante il supporto, compromettendo la bontà della prova.</p></div>
<div class="card"><h4>La domanda chiave</h4><p>«Qual è il nostro obiettivo?» Nel mondo dei correttori automatici e dell'intelligenza artificiale, qualsiasi studente troverà supporti per risolvere le questioni di forma scritta. Potrebbe avere senso insegnare non solo la scrittura tradizionale, ma <b>come utilizzare con sapienza questi nuovi strumenti</b>?</p></div>
</div>
<h4>Lingue classiche</h4>
<p>Nella scuola italiana non esiste un accordo comune sull'obiettivo dell'insegnamento delle lingue classiche. Le strade tentate: specchietti riassuntivi predisposti per studenti con DSA e forniti con i libri di testo; didattica alternativa con gamification e didattica per immagini (fumetti in latino e greco); <b>metodo induttivo-contestuale</b> (il cosiddetto metodo natura, citato nelle Indicazioni nazionali del 2010).</p>
<div class="box alert"><b class="tag">La criticità del lessico</b>Si tende a potenziare l'elemento culturale e il lavoro sul lessico. Ma quando dietro alla maschera dell'apprendimento del lessico si nascondono in realtà <b>prove puramente mnemoniche</b> — lunghe liste di vocaboli da imparare a memoria — la proposta non intercetta le necessità di ragazze e ragazzi con DSA.</div>
