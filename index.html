html:`
<p class="lead">Quattro unità già compilate e due schede-template. La struttura è sempre la stessa: <b>obiettivo in una frase</b>, schema fisso, parole chiave, autovalutazione. È la ripetizione della struttura, non il contenuto, a rendere il materiale accessibile.</p>

<h3>1. La struttura ricorrente</h3>
<table>
<tr><th>Fase</th><th>Che cosa si fa</th></tr>
<tr><td><b>Prima</b> (2–3 minuti)</td><td>Leggiamo la consegna insieme e la riscriviamo in 2 righe. Evidenziamo 3–5 parole chiave. Scegliamo lo strumento (mappa, tabella, formulario) se previsto.</td></tr>
<tr><td><b>Durante</b></td><td>Una cosa per volta, con passi numerati. Se non capisco: torno alle parole chiave o allo schema. Se previsto: uso gli strumenti <b>senza vergogna</b>.</td></tr>
<tr><td><b>Dopo</b> (autovalutazione)</td><td>Ho capito l'obiettivo? Quale strategia mi ha aiutato di più? Cosa rifarei diverso la prossima volta? Voto sforzo 0–10.</td></tr>
</table>

<h3>2. Geografia primaria — «il luogo in 6 caselle»</h3>
<p><b>Classe</b> 5ª · <b>Obiettivo</b> descrivere la Toscana seguendo sei caselle · <b>Tempo</b> 30–40 minuti</p>
<table>
<tr><th>Aspetto</th><th>Esempio compilato</th></tr>
<tr><td>Posizione</td><td>Centro Italia; confina con Liguria, Emilia-Romagna, Marche, Umbria, Lazio; affaccio sul Mar Tirreno</td></tr>
<tr><td>Clima</td><td>mite sulle coste, più freddo in montagna</td></tr>
<tr><td>Paesaggio</td><td>colline, coste, Appennini; fiumi come l'Arno</td></tr>
<tr><td>Popolazione</td><td>città principali: Firenze, Pisa, Siena</td></tr>
<tr><td>Economia</td><td>turismo, agricoltura (vino, olio), artigianato</td></tr>
<tr><td>Parole chiave</td><td>Firenze, Arno, colline, turismo, vino</td></tr>
</table>
<p><b>Legenda mappa</b>: ★ capoluogo · ≈ fiume · ▭ montagna · ~ mare.<br>
<b>Racconto in 60 secondi</b>: «La Toscana si trova nel Centro Italia e si affaccia sul Mar Tirreno. Ha colline e monti dell'Appennino, con fiumi come l'Arno. Il clima è mite sulle coste. Le città principali sono Firenze, Pisa e Siena. L'economia si basa su turismo e agricoltura, come vino e olio.»</p>
<p class="small">Per altre regioni: si mantengono le sei caselle e si cambiano i contenuti. La costanza dello schema è il compensativo.</p>

<h3>3. Geografia medie — confronto fra due aree</h3>
<p><b>Classe</b> 1ª media · <b>Obiettivo</b> descrivere due aree europee e confrontarle · <b>Tempo</b> 40–55 minuti</p>
<table>
<tr><th>Aspetto</th><th>Scandinavia</th><th>Mediterraneo</th></tr>
<tr><td>Posizione</td><td>Nord Europa (Norvegia, Svezia, Finlandia)</td><td>Sud Europa, intorno al Mediterraneo</td></tr>
<tr><td>Clima</td><td>freddo; inverni lunghi, estati brevi</td><td>estati calde e secche, inverni miti e piovosi</td></tr>
<tr><td>Paesaggio</td><td>foreste, laghi, fiordi, tundra a nord</td><td>coste, colline, macchia mediterranea</td></tr>
<tr><td>Popolazione</td><td>densità bassa; città nel sud e sulle coste</td><td>densità più alta in città e zone costiere</td></tr>
<tr><td>Economia</td><td>pesca, legno, energia, servizi</td><td>turismo, agricoltura (olio, vite), servizi</td></tr>
<tr><td>Parole chiave</td><td>freddo, fiordi, foreste, laghi</td><td>caldo, coste, turismo, olio</td></tr>
</table>
<p><b>Confronto atteso</b>: temperatura, precipitazioni ed economia. Tenere la struttura fissa è ciò che permette al confronto di emergere senza sovraccarico.</p>

<h3>4. Italiano medie — analisi del testo e riassunto guidato</h3>
<p><b>Classe</b> 2ª media · <b>Obiettivo</b> individuare le 5W, il narratore e il tema, e scrivere un riassunto di 6 righe · <b>Tempo</b> 40–50 minuti</p>
<h4>Brano segmentato</h4>
<div class="card">
<p><b>Segmento 1</b> — Quando Marco arrivò al parco, la panchina era già occupata. Una signora anziana teneva un quaderno sulle ginocchia e scriveva lentamente, come se pesasse ogni parola.</p>
<p><b>Segmento 2</b> — Marco restò in piedi. Aveva bisogno di sedersi: nello zaino c'era la sua verifica corretta, piena di segni rossi. Pensò di tornare a casa, ma la signora alzò lo sguardo e gli fece un cenno.</p>
<p><b>Segmento 3</b> — «Vuoi leggere?» chiese, indicando il quaderno. Marco scosse la testa. «Non sono bravo.» La signora sorrise: «Allora iniziamo da una riga. Una riga è già un passo.»</p>
</div>
<p><b>Glossario</b>: occupata = già presa da qualcuno · ginocchia = parte delle gambe quando le pieghi · pesasse = valutasse con attenzione · cenno = gesto breve per chiamare o indicare · riga = una linea di testo.</p>
<p><b>Analisi guidata</b> — Chi? Marco e una signora anziana. Dove? Al parco, vicino a una panchina. Quando? Un pomeriggio non specificato. Cosa succede? Marco è triste per una verifica; la signora lo invita a leggere una riga per iniziare. Perché è importante? Mostra che i piccoli passi aiutano a superare la paura. Narratore: terza persona. Tema: paura di non essere capace, incoraggiamento, piccoli passi. Sequenza: arrivo → disagio → incontro → proposta.</p>
<p class="small">Tre elementi rendono accessibile il compito: la <b>segmentazione</b> del brano, il <b>glossario preventivo</b> e la <b>lunghezza dichiarata</b> del riassunto (6 righe). Nessuno dei tre riduce l'obiettivo.</p>

<h3>5. Scienze primaria — piante e luce</h3>
<p><b>Classe</b> 5ª · <b>Obiettivo</b> compilare domanda → ipotesi → procedura → osservazioni → conclusione · <b>Tempo</b> 20 minuti + osservazioni per 5 giorni</p>
<table>
<tr><th>Passo</th><th>Compilato</th></tr>
<tr><td>Domanda</td><td>Le piantine crescono meglio con luce o al buio?</td></tr>
<tr><td>Ipotesi</td><td>Con la luce crescono meno in altezza ma sono più verdi e forti</td></tr>
<tr><td>Materiali</td><td>2 vasetti, cotone o terra, semi di lenticchie, acqua, righello</td></tr>
<tr><td>Procedura</td><td>1) semi in 2 vasetti · 2) uno vicino alla finestra · 3) uno in un armadio · 4) annaffio uguale · 5) misuro ogni giorno</td></tr>
<tr><td>Osservazioni</td><td>G1: luce 0,5 cm, buio 0,5 cm · G3: luce 2 cm verde, buio 3 cm pallido · G5: luce 4 cm verde, buio 5 cm giallo e debole</td></tr>
<tr><td>Conclusione</td><td>Al buio cresce più in altezza ma è debole e gialla. Con la luce cresce sana e verde</td></tr>
</table>
<p><b>Parole chiave</b>: ipotesi = idea da verificare · misurare = usare il righello · osservare = guardare e descrivere · conclusione = cosa ho scoperto.</p>

<h3>6. Scienze medie — osmosi con le patate</h3>
<p><b>Classe</b> 2ª media · <b>Obiettivo</b> spiegare la differenza fra acqua e acqua salata sui tessuti vegetali · <b>Tempo</b> 30–40 min + attesa 45 min</p>
<table>
<tr><th>Passo</th><th>Compilato</th></tr>
<tr><td>Domanda</td><td>Cosa succede a un bastoncino di patata in acqua salata rispetto all'acqua normale?</td></tr>
<tr><td>Ipotesi</td><td>In acqua salata perde acqua e diventa più morbido; in acqua normale resta più duro</td></tr>
<tr><td>Procedura</td><td>1) taglio 2 bastoncini uguali · 2) uno in acqua, uno in acqua salata · 3) aspetto 45 minuti · 4) confronto consistenza e aspetto</td></tr>
<tr><td>Osservazioni</td><td>Dopo 45 minuti: in acqua normale più duro; in acqua salata più flessibile e leggermente raggrinzito</td></tr>
<tr><td>Conclusione</td><td>In acqua salata l'acqua esce dalle cellule (osmosi) → perde turgore e si ammorbidisce</td></tr>
</table>
<p><b>Parole chiave</b>: osmosi = passaggio di acqua attraverso una membrana · soluzione salina = acqua con sale · turgore = rigidità delle cellule.</p>
<p><b>Spiegazione in 4 frasi</b>: 1) Le cellule hanno una membrana e contengono acqua. 2) In acqua salata fuori c'è più sale: l'acqua tende a uscire dalle cellule. 3) La patata perde turgore e diventa più morbida. 4) In acqua normale resta più dura.</p>
<div class="box key"><b class="tag">Il dispositivo che si ripete</b>«Spiegazione in 4 frasi», «racconto in 60 secondi», «riassunto in 6 righe». Dichiarare in anticipo la lunghezza attesa toglie una variabile di incertezza e riduce l'ansia da prestazione, senza semplificare il contenuto.</div>

<h3>7. Inglese medie — routine da 10 minuti</h3>
<ol>
<li><b>8 parole nuove</b>: le scrivo, le traduco, disegno un simbolo;</li>
<li><b>3 frasi modello</b> (sentence frames);</li>
<li><b>ripeto ad alta voce</b>, anche con audio.</li>
</ol>
<p><b>Word bank</b>: tabella a due colonne, English / italiano o immagine.<br>
<b>Sentence frames</b> da completare: «I like ______ because ______.» · «There is / There are ______.» · «Yesterday I ______ and then I ______.»</p>

<h3>8. Traccia per un mini-corso ai docenti</h3>
<p>Otto lezioni da 10–15 minuti l'una, ciascuna con un compito operativo:</p>
<ol>
<li><b>Cosa valutiamo davvero</b>: obiettivo contro difficoltà strumentali. «Comprendere il testo» contro «leggere velocemente». <i>Compito</i>: riscrivi l'obiettivo di una tua prova.</li>
<li><b>Consegne chiare</b>: una consegna per riga, verbo operativo evidenziato, esempio prima/dopo. <i>Compito</i>: riscrivi 5 consegne.</li>
<li><b>Layout e carico cognitivo</b>: spaziatura, segmentazione, riduzione dei passaggi mentali. <i>Compito</i>: ridisegna una pagina.</li>
<li><b>Adattare senza abbassare</b>: mantieni l'obiettivo, cambia il mezzo. <i>Compito</i>: scegli 3 strumenti e stabilisci quando usarli.</li>
<li><b>Orali strutturati</b>: percorsi A/B/C, domande guida. <i>Compito</i>: prepara una scheda orale.</li>
<li><b>Rubriche e criteri trasparenti</b>: 4 livelli con descrittori, coerenza con PDP/PEI. <i>Compito</i>: crea 2 criteri per la tua materia.</li>
<li><b>PDP-ready</b>: far combaciare documento e prove reali; errori tipici (scrivere e poi non applicare). <i>Compito</i>: audit su un PDP.</li>
<li><b>Laboratorio finale</b>: scegli una prova reale, applica la checklist, crea versione base e adattata. <i>Output</i>: 2 file pronti.</li>
</ol>

/* ============================================================

const KEY = "corso-dsa-bes-v1";
const S = load();
function load(){
  try{ return Object.assign({done:[],scores:{},notes:{},tools:{}}, JSON.parse(localStorage.getItem(KEY)||"{}")); }
  catch(e){ return {done:[],scores:{},notes:{},tools:{}}; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

let current = 0;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============================================================
   NAVIGAZIONE
   ============================================================ */
function renderNav(filter){
  const q = (filter||"").trim().toLowerCase();
  let html = "", parte = "";
  M.forEach((m,i)=>{
    if(q){
      const hay = (m.titolo + " " + m.parte + " " + (m.html||"")).toLowerCase();
      if(hay.indexOf(q) === -1) return;
    }
    if(m.parte !== parte){ parte = m.parte; html += '<div class="navgroup">'+esc(parte)+'</div>'; }
    const done = S.done.indexOf(m.id) > -1;
    html += '<button class="navitem'+(i===current?" active":"")+'" data-i="'+i+'">'
         +  '<span class="num">'+(i+1)+'.</span><span>'+esc(m.titolo)+'</span>'
         +  (done?'<span class="tick">✔</span>':'')+'</button>';
  });
  if(!html) html = '<p class="small" style="padding:.5rem">Nessun risultato.</p>';
  $("#nav").innerHTML = html;
  $("#nav").querySelectorAll(".navitem").forEach(b=>{
    b.onclick = ()=> go(+b.dataset.i);
  });
}

function updateProgress(){
  const n = S.done.length, t = M.length;
  $("#progresslabel").textContent = n + " di " + t + " moduli completati";
  $("#bar > i").style.width = (100*n/t) + "%";
}

function go(i){
  current = Math.max(0, Math.min(M.length-1, i));
  render();
  renderNav($("#search").value);
  window.scrollTo({top:0, behavior:"smooth"});
  $("#main").focus();
}

/* ============================================================
   RENDER MODULO
   ============================================================ */
function render(){
  const m = M[current];
  const done = S.done.indexOf(m.id) > -1;
  let h = '<h2 class="mtitle">'+esc(m.titolo)+'</h2>'
        + '<div class="meta">'+esc(m.parte)+' · modulo '+(current+1)+' di '+M.length
        + (m.durata? ' · '+esc(m.durata):'')+'</div>'
        + m.html;

  if(m.tools) h += toolHTML(m.tools);
  if(m.exam)  h += '<div id="quizbox"></div>';
  else if(m.quiz && m.quiz.length) h += '<div id="quizbox"></div>';

  h += '<div class="card noprint"><h4>I miei appunti</h4>'
     + '<textarea class="f" id="notes" placeholder="Annota qui domande, esempi dalla tua classe, cose da verificare…"></textarea>'
     + '<p class="small" id="notesaved">Gli appunti restano su questo computer.</p></div>';

  h += '<div class="footnav noprint">'
     + (current>0? '<button class="btn ghost" id="prev">← '+esc(M[current-1].titolo.slice(0,32))+'</button>':'')
     + '<button class="btn" id="markdone">'+(done?'✔ Completato — annulla':'Segna come completato')+'</button>'
     + (current<M.length-1? '<button class="btn ghost" id="next">'+esc(M[current+1].titolo.slice(0,32))+' →</button>':'')
     + '</div>';

  $("#main").innerHTML = h;

  const ta = $("#notes");
  if(ta){
    ta.value = S.notes[m.id] || "";
    let t0;
    ta.oninput = ()=>{ S.notes[m.id]=ta.value; clearTimeout(t0); t0=setTimeout(()=>{save(); $("#notesaved").textContent="Salvato.";},400); };
  }
  if($("#prev")) $("#prev").onclick = ()=>go(current-1);
  if($("#next")) $("#next").onclick = ()=>go(current+1);
  if($("#markdone")) $("#markdone").onclick = ()=>{
    const k = S.done.indexOf(m.id);
    if(k>-1) S.done.splice(k,1); else S.done.push(m.id);
    save(); updateProgress(); render(); renderNav($("#search").value);
  };

  if(m.exam) renderQuiz(buildExam(), "esame", 30);
  else if(m.quiz && m.quiz.length) renderQuiz(m.quiz, m.id, m.quiz.length);

  bindTools(m.tools);
}

/* ============================================================
   QUIZ
   ============================================================ */
function buildExam(){
  const pool = [];
  M.forEach(m => (m.quiz||[]).forEach(q => pool.push(q)));
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  return pool.slice(0, Math.min(30, pool.length));
}

function renderQuiz(items, id, n){
  const box = $("#quizbox");
  if(!box) return;
  const prev = S.scores[id];
  let h = '<div class="quiz"><h3 style="margin-top:0">'+(id==="esame"?"Verifica finale":"Metti alla prova")+'</h3>';
  h += '<p class="small">'+items.length+' domande. Le domande a risposta multipla possono avere più risposte corrette.'
     + (prev!=null? ' Ultimo punteggio: <b>'+prev+'%</b>.':'')+'</p>';
  items.forEach((q,i)=>{
    h += '<div class="q" data-i="'+i+'"><div class="qt">'+(i+1)+'. '+esc(q.q)+'</div>';
    if(q.t === "tf"){
      ["Vero","Falso"].forEach((o,j)=>{
        h += '<label class="opt"><input type="radio" name="q'+id+i+'" value="'+j+'"><span>'+o+'</span></label>';
      });
    } else {
      const type = q.t === "multi" ? "checkbox" : "radio";
      q.o.forEach((o,j)=>{
        h += '<label class="opt"><input type="'+type+'" name="q'+id+i+'" value="'+j+'"><span>'+esc(o)+'</span></label>';
      });
    }
    h += '<div class="why" hidden>'+esc(q.why||"")+'</div></div>';
  });
  h += '<div style="display:flex;gap:.7rem;margin-top:1rem;flex-wrap:wrap">'
     + '<button class="btn" id="correct">Correggi</button>'
     + '<button class="btn ghost" id="again">Ricomincia</button></div>'
     + '<div class="score" id="score"></div></div>';
  box.innerHTML = h;

  $("#again").onclick = ()=> renderQuiz(id==="esame"? buildExam() : items, id, n);
  $("#correct").onclick = ()=>{
    let ok = 0;
    items.forEach((q,i)=>{
      const el = box.querySelector('.q[data-i="'+i+'"]');
      const sel = Array.from(el.querySelectorAll("input:checked")).map(x=>+x.value).sort();
      const cor = q.c.slice().sort();
      const good = sel.length === cor.length && sel.every((v,k)=>v===cor[k]);
      el.classList.remove("good","bad");
      el.classList.add(good ? "good" : "bad");
      el.querySelector(".why").hidden = false;
      if(good) ok++;
    });
    const pct = Math.round(100*ok/items.length);
    S.scores[id] = pct; save();
    const verdict = pct>=70 ? "Superato." : (pct>=50 ? "Quasi: rivedi i punti sbagliati." : "Conviene rileggere il modulo.");
    $("#score").innerHTML = ok+" risposte corrette su "+items.length+" — <b>"+pct+"%</b>. "+verdict;
    $("#score").scrollIntoView({behavior:"smooth", block:"center"});
  };
}

function toolHTML(kind){
  if(kind === "compensativi"){
    let h = '<div class="card noprint"><h3 style="margin-top:0">Selettore strumenti e misure</h3>'
      + '<p class="small">Spunta ciò che è pertinente al profilo che stai seguendo e genera l\'elenco da incollare nel PDP.</p><div class="grid2">';
    h += '<div><h4>Strumenti compensativi</h4>';
    Object.keys(COMP).forEach(g=>{
      h += '<p class="small" style="margin:.6rem 0 .1rem"><b>'+g+'</b></p>';
      COMP[g].forEach(v=> h += '<label class="chk"><input type="checkbox" data-t="C" value="'+esc(v)+'"><span>'+esc(v)+'</span></label>');
    });
    h += '</div><div><h4>Misure dispensative</h4>';
    Object.keys(DISP).forEach(g=>{
      h += '<p class="small" style="margin:.6rem 0 .1rem"><b>'+g+'</b></p>';
      DISP[g].forEach(v=> h += '<label class="chk"><input type="checkbox" data-t="D" value="'+esc(v)+'"><span>'+esc(v)+'</span></label>');
    });
    h += '</div></div><button class="btn" id="genlist" style="margin-top:1rem">Genera elenco</button><div id="out" hidden></div></div>';
    return h;
  }
  if(kind === "verifica"){
    let h = '<div class="card noprint"><h3 style="margin-top:0">Checklist della verifica inclusiva</h3>'
      + '<p class="small">Dodici controlli da fare prima di somministrare una prova.</p>';
    VERIF.forEach((v,i)=> h += '<label class="chk"><input type="checkbox" data-v="'+i+'"><span>'+esc(v)+'</span></label>');
    h += '<p class="score" id="vscore">0 di '+VERIF.length+'</p></div>';
    return h;
  }
  if(kind === "pdp"){
    const F = [["alunno","Alunno (iniziali)"],["classe","Classe e istituto"],["diagnosi","Diagnosi: tipologia, data, ente"],
      ["lettura","Lettura — diagnosi / osservazione in classe"],["scrittura","Scrittura — diagnosi / osservazione in classe"],
      ["calcolo","Calcolo — diagnosi / osservazione in classe"],["forza","Punti di forza e interessi"],
      ["strategie","Strategie e metodi di insegnamento"],["comp","Strumenti compensativi"],["disp","Misure dispensative"],
      ["val","Forme di verifica e valutazione personalizzate"],["fam","Accordi con la famiglia e monitoraggio"]];
    let h = '<div class="card noprint"><h3 style="margin-top:0">Bozza di PDP</h3>'
      + '<p class="small">Compila le voci minime previste dalle Linee guida e genera una bozza da rivedere in consiglio di classe. Non sostituisce il modello adottato dal tuo istituto.</p>';
    F.forEach(f=>{
      h += '<label class="f" for="p_'+f[0]+'">'+esc(f[1])+'</label>';
      h += (f[0]==="alunno"||f[0]==="classe")
        ? '<input class="f" id="p_'+f[0]+'">'
        : '<textarea class="f" id="p_'+f[0]+'"></textarea>';
    });
    h += '<div style="display:flex;gap:.7rem;margin-top:1rem;flex-wrap:wrap">'
      + '<button class="btn" id="genpdp">Genera bozza</button>'
      + '<button class="btn ghost" id="copypdp">Copia negli appunti</button></div><div id="out" hidden></div></div>';
    return h;
  }
  return "";
}

function bindTools(kind){
  if(kind === "compensativi"){
    const btn = $("#genlist"); if(!btn) return;
    btn.onclick = ()=>{
      const g = t => Array.from(document.querySelectorAll('input[data-t="'+t+'"]:checked')).map(x=>"  - "+x.value);
      const c = g("C"), d = g("D");
      const out = $("#out");
      out.hidden = false;
      out.textContent = "STRUMENTI COMPENSATIVI\n" + (c.length? c.join("\n") : "  (nessuno selezionato)")
        + "\n\nMISURE DISPENSATIVE\n" + (d.length? d.join("\n") : "  (nessuna selezionata)")
        + "\n\nNota: ogni misura va motivata sulla base dell'effettiva incidenza del disturbo sulla prestazione richiesta,\nsenza differenziare gli obiettivi del percorso di apprendimento.";
    };
  }
  if(kind === "verifica"){
    const boxes = Array.from(document.querySelectorAll('input[data-v]'));
    if(!boxes.length) return;
    const upd = ()=>{
      const n = boxes.filter(b=>b.checked).length;
      $("#vscore").textContent = n + " di " + boxes.length + (n===boxes.length? " — la prova è pronta." : "");
    };
    boxes.forEach(b=> b.onchange = upd);
  }
  if(kind === "pdp"){
    const btn = $("#genpdp"); if(!btn) return;
    const build = ()=>{
      const v = id => (document.getElementById("p_"+id).value || "—").trim();
      return "PIANO DIDATTICO PERSONALIZZATO — bozza di lavoro\n"
        + "==================================================\n"
        + "Alunno: " + v("alunno") + "\nClasse / istituto: " + v("classe")
        + "\nData bozza: " + new Date().toLocaleDateString("it-IT")
        + "\n\n1. DIAGNOSI\n" + v("diagnosi")
        + "\n\n2. FUNZIONAMENTO DELLE ABILITÀ\nLettura: " + v("lettura")
        + "\nScrittura: " + v("scrittura") + "\nCalcolo: " + v("calcolo")
        + "\nPunti di forza e interessi: " + v("forza")
        + "\n\n3. DIDATTICA PERSONALIZZATA\nStrategie e metodi: " + v("strategie")
        + "\nStrumenti compensativi: " + v("comp")
        + "\nMisure dispensative: " + v("disp")
        + "\n\n4. VERIFICA E VALUTAZIONE\n" + v("val")
        + "\n\n5. RAPPORTI SCUOLA-FAMIGLIA E MONITORAGGIO\n" + v("fam")
        + "\n\n--------------------------------------------------\n"
        + "Da condividere con il consiglio di classe e la famiglia entro il primo trimestre.\n"
        + "Riferimenti: L. 170/2010, D.M. 5669/2011 e relative Linee guida.";
    };
    btn.onclick = ()=>{ const o=$("#out"); o.hidden=false; o.textContent = build(); };
    $("#copypdp").onclick = ()=>{
      const txt = build();
      if(navigator.clipboard) navigator.clipboard.writeText(txt).then(
        ()=>{ $("#copypdp").textContent = "Copiato ✔"; setTimeout(()=>$("#copypdp").textContent="Copia negli appunti",1600); },
        ()=>{ const o=$("#out"); o.hidden=false; o.textContent=txt; }
      );
      else { const o=$("#out"); o.hidden=false; o.textContent=txt; }
    };
  }
}

  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  try{ localStorage.setItem(KEY+"-theme", dark?"light":"dark"); }catch(e){}
};
$("#btnRuler").onclick = e =>{
  const on = document.documentElement.getAttribute("data-ruler") === "on";
  document.documentElement.setAttribute("data-ruler", on ? "off" : "on");
  e.currentTarget.setAttribute("aria-pressed", String(!on));
};
document.addEventListener("mousemove", ev=>{
  if(document.documentElement.getAttribute("data-ruler") !== "on") return;
  $("#ruler").style.top = (ev.clientY - 18) + "px";
});
/* il tasto Home compare solo online: nella copia inviata come file resterebbe un link morto */
if(location.protocol.indexOf("http") === 0) $("#tasto-home").hidden = false;

$("#btnPrint").onclick = ()=> window.print();
$("#btnReset").onclick = ()=>{
  if(!confirm("Azzerare progressi, punteggi e appunti salvati su questo computer?")) return;
  S.done = []; S.scores = {}; S.notes = {}; save();
  updateProgress(); render(); renderNav($("#search").value);
};
$("#search").oninput = e => renderNav(e.target.value);
document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea")) return;
  if(e.key === "ArrowRight" && current < M.length-1) go(current+1);
  if(e.key === "ArrowLeft"  && current > 0)          go(current-1);
});

/* ripristina preferenze */
try{
  const f = localStorage.getItem(KEY+"-fs");
  if(f !== null){ fsi = +f; document.documentElement.style.setProperty("--fs", FS[fsi]+"px"); }
  if(localStorage.getItem(KEY+"-dys") === "on"){ document.documentElement.setAttribute("data-dys","on"); $("#btnDys").setAttribute("aria-pressed","true"); }
  const th = localStorage.getItem(KEY+"-theme");
  if(th) document.documentElement.setAttribute("data-theme", th);
}catch(e){}

/* avvio: riprende dal primo modulo non completato */
const firstOpen = M.findIndex(m => S.done.indexOf(m.id) === -1);
current = firstOpen > -1 ? firstOpen : 0;
updateProgress();
render();
renderNav("");
</script>
</body>
</html>
